name: Build caches
description: Named cache presets shared by every job.

inputs:
  restore:
    description: Space-separated preset names to restore.
    required: false
    default: ''
  save:
    description: Space-separated preset names to save.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - if: contains(inputs.restore, 'target-dev')
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: target
        key: target-dev-${{ hashFiles('Cargo.lock') }}
        restore-keys: target-dev-

    - if: contains(inputs.restore, 'target-prod')
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: target
        key: target-prod-${{ hashFiles('Cargo.lock') }}
        restore-keys: target-prod-

    - if: contains(inputs.restore, 'target-askar')
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: plugins/askar/target
        key: target-askar-${{ hashFiles('Cargo.lock') }}
        restore-keys: target-askar-

    - if: contains(inputs.restore, 'wrapper-nodejs')
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          wrappers/nodejs/node_modules
          wrappers/nodejs/dist
          wrappers/nodejs/*.node
          wrappers/nodejs/binary.js
          wrappers/nodejs/binary.d.ts
          wrappers/nodejs/index.js
          wrappers/nodejs/index.d.ts
        key: wrapper-nodejs-${{ github.sha }}

    - if: contains(inputs.restore, 'wrapper-wasm')
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          wrappers/wasm/node_modules
          wrappers/wasm/pkg
          wrappers/wasm/dist
        key: wrapper-wasm-${{ github.sha }}

    - if: contains(inputs.restore, 'wrapper-uniffi')
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          target/debug/libequssdk.so
          wrappers/uniffi/kotlin/src/main/kotlin
        key: wrapper-uniffi-${{ github.sha }}

    - if: contains(inputs.restore, 'target-wasm')
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: target/wasm32-unknown-unknown
        key: target-wasm-${{ hashFiles('Cargo.lock') }}
        restore-keys: target-wasm-

    - if: contains(inputs.restore, 'target-android')
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          target/aarch64-linux-android
          target/armv7-linux-androideabi
          target/i686-linux-android
          target/x86_64-linux-android
        key: target-android-${{ hashFiles('Cargo.lock') }}
        restore-keys: target-android-

    - if: contains(inputs.restore, 'wrapper-swift')
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          wrappers/uniffi/swift/ios/debug
          wrappers/uniffi/swift/Sources
        key: wrapper-swift-${{ github.sha }}

    - if: contains(inputs.restore, 'wrapper-askar')
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          plugins/askar/wrappers/nodejs/node_modules
          plugins/askar/wrappers/nodejs/build
          plugins/askar/wrappers/nodejs/*.node
          plugins/askar/wrappers/nodejs/binary.js
          plugins/askar/wrappers/nodejs/binary.d.ts
        key: wrapper-askar-${{ github.sha }}

    - if: contains(inputs.save, 'target-dev')
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: target
        key: target-dev-${{ hashFiles('Cargo.lock') }}

    - if: contains(inputs.save, 'target-prod')
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: target
        key: target-prod-${{ hashFiles('Cargo.lock') }}

    - if: contains(inputs.save, 'target-askar')
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: plugins/askar/target
        key: target-askar-${{ hashFiles('Cargo.lock') }}

    - if: contains(inputs.save, 'wrapper-nodejs')
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          wrappers/nodejs/node_modules
          wrappers/nodejs/dist
          wrappers/nodejs/*.node
          wrappers/nodejs/binary.js
          wrappers/nodejs/binary.d.ts
          wrappers/nodejs/index.js
          wrappers/nodejs/index.d.ts
        key: wrapper-nodejs-${{ github.sha }}

    - if: contains(inputs.save, 'wrapper-wasm')
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          wrappers/wasm/node_modules
          wrappers/wasm/pkg
          wrappers/wasm/dist
        key: wrapper-wasm-${{ github.sha }}

    - if: contains(inputs.save, 'wrapper-uniffi')
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          target/debug/libequssdk.so
          wrappers/uniffi/kotlin/src/main/kotlin
        key: wrapper-uniffi-${{ github.sha }}

    - if: contains(inputs.save, 'target-wasm')
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: target/wasm32-unknown-unknown
        key: target-wasm-${{ hashFiles('Cargo.lock') }}

    - if: contains(inputs.save, 'target-android')
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          target/aarch64-linux-android
          target/armv7-linux-androideabi
          target/i686-linux-android
          target/x86_64-linux-android
        key: target-android-${{ hashFiles('Cargo.lock') }}

    - if: contains(inputs.save, 'wrapper-swift')
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          wrappers/uniffi/swift/ios/debug
          wrappers/uniffi/swift/Sources
        key: wrapper-swift-${{ github.sha }}

    - if: contains(inputs.save, 'wrapper-askar')
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          plugins/askar/wrappers/nodejs/node_modules
          plugins/askar/wrappers/nodejs/build
          plugins/askar/wrappers/nodejs/*.node
          plugins/askar/wrappers/nodejs/binary.js
          plugins/askar/wrappers/nodejs/binary.d.ts
        key: wrapper-askar-${{ github.sha }}
