name: Setup Rust tooling
description: >-
  Mirrors the .rust_job_configs anchor in .gitlab-ci.yml (lines 46-50):
  restores the sccache and npm caches, installs cargo-binstall plus sccache,
  and optionally adds rustup components. Assumes a Rust toolchain is already
  on PATH — see setup-rustup for images that do not ship one.

inputs:
  cache-key:
    description: >-
      Suffix keeping this job's sccache/npm entries separate from other jobs'.
      GitHub cache entries are write-once, so the full key also embeds a
      lockfile hash; GitLab's static `key: sccache` has no direct equivalent.
    required: true
  components:
    description: Space-separated rustup components to add, e.g. "clippy".
    required: false
    default: ''
  install-tooling:
    description: >-
      Install cargo-binstall and sccache. Set false for jobs that compile
      nothing (cargo fmt), where the bootstrap is pure overhead.
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Export cache paths
      shell: bash
      run: |
        set -euo pipefail
        # $GITHUB_WORKSPACE is correct both on the host and inside a container.
        # A ${{ github.workspace }} expression is not — it resolves host-side.
        echo "SCCACHE_DIR=$GITHUB_WORKSPACE/.sccache" >> "$GITHUB_ENV"
        echo "npm_config_cache=$GITHUB_WORKSPACE/.npm" >> "$GITHUB_ENV"
        echo "${CARGO_HOME:-$HOME/.cargo}/bin" >> "$GITHUB_PATH"

    - name: Restore sccache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .sccache
        key: sccache-${{ inputs.cache-key }}-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          sccache-${{ inputs.cache-key }}-
          sccache-

    - name: Restore npm cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .npm
        key: npm-${{ inputs.cache-key }}-${{ hashFiles('**/package.json') }}
        restore-keys: |
          npm-${{ inputs.cache-key }}-
          npm-

    - name: Install cargo-binstall and sccache
      if: inputs.install-tooling == 'true'
      shell: bash
      run: |
        set -euo pipefail
        curl -L --proto '=https' --tlsv1.2 -sSf \
          https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh \
          | bash
        RUSTC_WRAPPER="" cargo binstall -y sccache

    - name: Add rustup components
      if: inputs.components != ''
      shell: bash
      run: rustup component add ${{ inputs.components }}
