name: Install Rust toolchain and tooling
description: Free runner disk, install rustup at a pinned toolchain, then the shared Rust tooling.

inputs:
  rust-version:
    description: Toolchain to install.
    required: true
  cache-key:
    description: Cache key suffix, unique per job.
    required: true
  components:
    description: Space-separated rustup components.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Free runner disk
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
          /usr/local/share/boost /usr/share/swift /usr/local/.ghcup \
          /opt/hostedtoolcache/CodeQL 2>/dev/null || true
        df -h / | tail -1

    - name: Install rustup
      shell: bash
      run: |
        set -euo pipefail
        version='${{ inputs.rust-version }}'
        if command -v rustup >/dev/null 2>&1; then
          rustup toolchain install "$version" --profile minimal
          rustup default "$version"
        else
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain "$version"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
        fi

    - name: Shared Rust tooling
      uses: ./.github/actions/setup-rust
      with:
        cache-key: ${{ inputs.cache-key }}
        components: ${{ inputs.components }}
