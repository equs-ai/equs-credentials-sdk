name: Install Rust toolchain and tooling
description: Install rustup at a pinned toolchain, then the shared Rust tooling.

inputs:
  rust-version:
    description: Toolchain to install.
    required: true
  cache-key:
    description: Cache key suffix, unique per job.
    required: true
  components:
    description: Space-separated rustup components.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Install rustup
      shell: bash
      run: |
        set -euo pipefail
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
          | sh -s -- -y --default-toolchain '${{ inputs.rust-version }}'
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

    - name: Shared Rust tooling
      uses: ./.github/actions/setup-rust
      with:
        cache-key: ${{ inputs.cache-key }}
        components: ${{ inputs.components }}
