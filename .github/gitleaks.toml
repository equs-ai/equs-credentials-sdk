  '''^plugins/askar/src/vault\.rs$''',
  '''^src/did/didkey\.rs$''',
  '''^src/did/didpeer\.rs$''',
  '''^src/did/didethr/types/did_doc_attribute\.rs$''',
  '''^src/utils/x509_truststore\.rs$''',
  '''^src/vc/dcql/mod\.rs$''',
  '''^src/vc/metadata/mod\.rs$''',
  '''^src/vc/oid4vp/tests\.rs$''',
  '''^src/vc/oid4vci/tests\.rs$''',
