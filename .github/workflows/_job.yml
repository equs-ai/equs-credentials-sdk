name: job

on:
  workflow_call:
    inputs:
      run: {type: string, required: true}
      cache-key: {type: string, required: true}
      restore: {type: string, default: ''}
      save: {type: string, default: ''}
      components: {type: string, default: ''}
      node: {type: boolean, default: false}
      java: {type: boolean, default: false}
      wasm: {type: boolean, default: false}
      sccache: {type: boolean, default: true}
      cargo-debug: {type: string, default: '0'}
      report-path: {type: string, default: target}
      artifact: {type: string, default: ''}
      artifact-path: {type: string, default: ''}
      options: {type: string, default: ''}
      timeout: {type: number, default: 30}
      codecov: {type: boolean, default: false}
      toolchain: {type: boolean, default: true}
      allow-failure: {type: boolean, default: false}
    secrets:
      CODECOV_TOKEN: {required: false}

env:
  RUST_VERSION: "1.97.0"
  NODE_VERSION: "20.18.0"
  SCCACHE_CACHE_SIZE: 1G
  CARGO_INCREMENTAL: "0"

jobs:
  run:
    runs-on: ubuntu-latest
    container:
      image: rust:1.97.0-bookworm
      options: ${{ inputs.options }}
    timeout-minutes: ${{ inputs.timeout }}
    env:
      RUSTC_WRAPPER: ${{ inputs.sccache && 'sccache' || '' }}
      CARGO_PROFILE_DEV_DEBUG: ${{ inputs.cargo-debug }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - if: inputs.node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - if: inputs.java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'

      - if: inputs.toolchain
        uses: ./.github/actions/setup-rustup
        with:
          rust-version: ${{ env.RUST_VERSION }}
          cache-key: ${{ inputs.cache-key }}
          components: ${{ inputs.components }}

      - if: inputs.wasm
        shell: bash
        run: |
          command -v clang >/dev/null || { apt-get update && apt-get install -y --no-install-recommends clang; }
          for i in 1 2 3; do
            curl --proto '=https' --tlsv1.2 -sSf https://rustwasm.github.io/wasm-pack/installer/init.sh | sh && break
            [ "$i" = 3 ] && { echo "wasm-pack install failed after 3 attempts" >&2; exit 1; }
            sleep 15
          done

      - uses: ./.github/actions/cache
        with:
          restore: ${{ inputs.restore }}

      - shell: bash
        continue-on-error: ${{ inputs.allow-failure }}
        run: ${{ inputs.run }}

      - if: inputs.save != ''
        uses: ./.github/actions/cache
        with:
          save: ${{ inputs.save }}

      - if: always() && inputs.codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: lcov.info
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - if: always()
        shell: bash
        run: |
          df -h / | tail -1
          du -sh '${{ inputs.report-path }}' 2>/dev/null || true

      - if: always() && inputs.artifact != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact }}
          path: ${{ inputs.artifact-path }}
          if-no-files-found: warn
