name: cache prune

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  actions: write

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/prune-wrapper-caches.sh --orphans-only
