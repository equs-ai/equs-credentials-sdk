name: CI

on:
  pull_request:
  push:
    branches: [main, test/ci-debian-refactor]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  # tier 1

  secret-scan:
    uses: ./.github/workflows/_job.yml
    with:
      cache-key: secret-scan
      toolchain: false
      artifact: gitleaks-report
      artifact-path: gitleaks-report.json
      run: |
        v=8.30.1
        sha=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        curl --proto '=https' --tlsv1.2 -sSfL -o gitleaks.tar.gz \
          "https://github.com/gitleaks/gitleaks/releases/download/v$v/gitleaks_${v}_linux_x64.tar.gz"
        echo "$sha  gitleaks.tar.gz" | sha256sum -c -
        tar -xzf gitleaks.tar.gz -C "$RUNNER_TEMP" gitleaks && rm -f gitleaks.tar.gz
        "$RUNNER_TEMP/gitleaks" dir . --config .github/gitleaks.toml --redact --verbose --exit-code 1 --report-format json --report-path gitleaks-report.json

  dependency-scan:
    uses: ./.github/workflows/_job.yml
    with:
      cache-key: dependency-scan
      artifact: cargo-audit-report
      artifact-path: cargo-audit-report.json
      run: |
        bash .github/scripts/binstall-or-build.sh cargo-audit "cargo audit --version"
        cargo audit --json > cargo-audit-report.json || true
        printf '### Dependency advisories\n\n```\n%s\n```\n' \
          "$(cargo audit --no-fetch 2>&1 | tail -n 60)" >> "$GITHUB_STEP_SUMMARY"
        grep -q '"vulnerabilities"' cargo-audit-report.json || { echo "cargo audit produced no report" >&2; exit 1; }

  lint-and-format:
    uses: ./.github/workflows/_job.yml
    with:
      cache-key: lint-and-format
      components: rustfmt clippy
      run: |
        cargo fmt --all -- --check
        cargo clippy --workspace --exclude wasm --all-targets --all-features -- -Dwarnings

  # tier 2

  build-prod:
    needs: [lint-and-format]
    uses: ./.github/workflows/_job.yml
    with:
      cache-key: build-prod
      restore: target-prod
      save: target-prod
      run: cargo build --release -p nodejs

  build-dev:
    needs: [lint-and-format]
    uses: ./.github/workflows/_job.yml
    with:
      cache-key: build-dev
      restore: target-dev
      save: target-dev
      run: cargo build --all-features --workspace --exclude wasm

  doc-build:
    needs: [lint-and-format]
    uses: ./.github/workflows/_job.yml
    with:
      cache-key: doc-build
      restore: target-dev
      run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --workspace --all-features --exclude nodejs --exclude wasm --exclude equs_sdk_uniffi

  # tier 3

  nodejs-wrapper:
    needs: [build-prod]
    uses: ./.github/workflows/_job.yml
    with:
      cache-key: nodejs-wrapper
      node: true
      restore: target-prod
      save: wrapper-nodejs
      run: |
        cd wrappers/nodejs
        npm i
        npm run build
        npm run build:debug

  wasm-wrapper:
    needs: [build-dev]
    uses: ./.github/workflows/_job.yml
    with:
      cache-key: wasm-wrapper
      node: true
      wasm: true
      sccache: false
      restore: target-dev
      save: wrapper-wasm
      run: |
        cd wrappers/wasm
        npm i
        npm run build
        npm run build:dev:cjs

  uniffi-wrapper:
    needs: [build-dev]
    uses: ./.github/workflows/_job.yml
    with:
      cache-key: uniffi-wrapper
      restore: target-dev
      save: wrapper-uniffi
      run: cd wrappers/uniffi && make kotlin-generate_kotlin_debug

  test-with-coverage:
    needs: [build-dev]
    uses: ./.github/workflows/_job.yml
    secrets: inherit
    with:
      cache-key: test-with-coverage
      cargo-debug: line-tables-only
      options: --security-opt seccomp=unconfined
      codecov: true
      artifact: tarpaulin-report
      artifact-path: tarpaulin-report.html
      run: |
        bash .github/scripts/binstall-or-build.sh cargo-tarpaulin "cargo tarpaulin --version"
        cargo tarpaulin --skip-clean --timeout 180 --all-features --exclude-files "src/didcomm/*" --exclude-files "demos/*" --exclude-files "dependencies/one-core/*" --exclude-files "wrappers/*" --fail-under 70 -o Html -o Lcov 2>&1 | tee tarpaulin.log || rc=$?
        line=$(grep -oE '[0-9.]+% coverage, [0-9/]+ lines covered' tarpaulin.log | tail -1) || true
        [ -n "$line" ] && msg="**$line** — gate: 70%" || msg="No coverage figure produced; tarpaulin did not reach the reporting stage."
        printf '### Coverage\n\n%s\n' "$msg" | tee -a "$GITHUB_STEP_SUMMARY"
        exit ${rc:-0}

  askar-rust:
    needs: [build-prod]
    uses: ./.github/workflows/_job.yml
    with:
      cache-key: askar-rust
      restore: target-askar
      save: target-askar
      report-path: plugins/askar/target
      run: CARGO_TARGET_DIR=plugins/askar/target cargo build --release -p askar

  oid4vc-demo:
    needs: [build-dev]
    uses: ./.github/workflows/_job.yml
    with:
      cache-key: oid4vc-demo
      restore: target-dev
      run: cd demos/oid4vc && ./demo.sh


  multi-thread-demo:
    needs: [build-dev]
    uses: ./.github/workflows/_job.yml
    with:
      cache-key: multi-thread-demo
      restore: target-dev
      run: |
        cd demos/multi-thread
        cargo build
        cargo run -- issuer > issuer.log 2>&1 &
        for i in $(seq 1 60); do
          (echo > /dev/tcp/127.0.0.1/4000) 2>/dev/null && break
          [ "$i" = 60 ] && { echo "issuer did not start"; cat issuer.log; exit 1; }
          sleep 2
        done
        RUST_LOG=ERROR cargo run -- holders 20 2>&1 | tee holders.log
        grep -qx Success holders.log || { echo "holders reported failures"; cat issuer.log; exit 1; }

  # tier 4

  nodejs-test:
    needs: [nodejs-wrapper]
    uses: ./.github/workflows/_job.yml
    with:
      cache-key: nodejs-test
      node: true
      restore: wrapper-nodejs
      run: |
        (cd wrappers/nodejs && npm run test)
        cd wrappers/test/js_common
        npm pkg set dependencies.equs-credentials-sdk=file:../../nodejs
        npm i
        npm run test:nodejs

  wasm-test:
    needs: [wasm-wrapper]
    uses: ./.github/workflows/_job.yml
    with:
      cache-key: wasm-test
      node: true
      sccache: false
      restore: wrapper-wasm
      run: |
        cd wrappers/test/js_common
        npm pkg set dependencies.equs-credentials-sdk=file:../../wasm/pkg
        npm i
        npm run test:wasm

  kotlin-test:
    needs: [uniffi-wrapper]
    uses: ./.github/workflows/_job.yml
    with:
      cache-key: kotlin-test
      java: true
      restore: target-dev wrapper-uniffi
      run: cd wrappers/uniffi && make kotlin-test

  swift-test:
    needs: [uniffi-wrapper]
    uses: ./.github/workflows/_swift.yml

  askar-wrapper:
    needs: [askar-rust, nodejs-wrapper]
    uses: ./.github/workflows/_job.yml
    with:
      cache-key: askar-wrapper
      node: true
      restore: target-askar wrapper-nodejs
      save: wrapper-askar
      report-path: plugins/askar/target
      run: |
        npm i --prefix plugins/askar/wrappers/nodejs
        npm run build --prefix plugins/askar/wrappers/nodejs

  demo-build:
    needs: [nodejs-wrapper, wasm-wrapper, askar-wrapper]
    uses: ./.github/workflows/_job.yml
    with:
      cache-key: demo-build
      node: true
      wasm: true
      sccache: false
      restore: target-dev
      run: |
        cd demos/wasm/oid4vc
        npm i
        npm run build

  nodejs-demo-build:
    needs: [nodejs-wrapper, askar-wrapper]
    uses: ./.github/workflows/_job.yml
    with:
      cache-key: nodejs-demo-build
      node: true
      restore: target-dev wrapper-nodejs wrapper-askar
      run: |
        cd demos/nodejs/oid4vc
        npm i --ignore-scripts
        npm run build

  android-demo:
    needs: [uniffi-wrapper]
    uses: ./.github/workflows/_android.yml

  ios-demo:
    needs: [swift-test]
    uses: ./.github/workflows/_ios.yml

  # tier 5

  askar-plugin-nodejs-test:
    needs: [nodejs-wrapper, askar-wrapper]
    uses: ./.github/workflows/_job.yml
    with:
      cache-key: askar-plugin-nodejs-test
      node: true
      restore: wrapper-nodejs wrapper-askar
      run: npm run test --prefix plugins/askar/wrappers/nodejs
