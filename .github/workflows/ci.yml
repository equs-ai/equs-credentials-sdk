name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RUST_VERSION: "1.97.0"
  NODE_VERSION: "20.18.0"
  RUSTC_WRAPPER: sccache
  SCCACHE_CACHE_SIZE: 2G
  CARGO_INCREMENTAL: "0"

jobs:

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install gitleaks
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --proto '=https' --tlsv1.2 -sSfL -o gitleaks.tar.gz "$url"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf gitleaks.tar.gz -C "$RUNNER_TEMP/bin" gitleaks
          chmod +x "$RUNNER_TEMP/bin/gitleaks"
          rm -f gitleaks.tar.gz
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Scan the working tree for secrets
        run: gitleaks dir . --config .github/gitleaks.toml --redact --verbose --exit-code 1 --report-format json --report-path gitleaks-report.json

      - name: Upload gitleaks report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          if-no-files-found: warn

  dependency-scan:
    name: dependency-scan
    runs-on: ubuntu-latest
    container: rust:1.97.0-bookworm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: dependency-scan

      - name: Install cargo-audit
        run: bash .github/scripts/binstall-or-build.sh cargo-audit "cargo audit --version"

      - name: Audit dependencies
        run: cargo audit --json > cargo-audit-report.json

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cargo-audit-report
          path: cargo-audit-report.json
          if-no-files-found: ignore

  lint-and-build:
    name: lint-and-build
    runs-on: ubuntu-latest
    container: rust:1.97.0-bookworm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: lint-and-build
          components: rustfmt clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --exclude wasm --all-targets --all-features -- -Dwarnings

      - name: Build
        run: cargo build --all-features --workspace --exclude wasm

      - name: Build docs
        run: cargo doc --no-deps --workspace --all-features --exclude nodejs --exclude wasm --exclude equs_sdk_uniffi
        env:
          RUSTDOCFLAGS: -D warnings

  test-with-coverage:
    name: test-with-coverage
    runs-on: ubuntu-latest
    container:
      image: rust:1.97.0-bookworm
      options: --security-opt seccomp=unconfined --cap-add SYS_PTRACE
    timeout-minutes: 60
    needs: [lint-and-build]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: test-with-coverage

      - name: Install cargo-tarpaulin
        run: bash .github/scripts/binstall-or-build.sh cargo-tarpaulin "cargo tarpaulin --version"

      - name: Run tests with coverage
        shell: bash
        run: |
          set -o pipefail
          cargo tarpaulin --skip-clean --timeout 180 --all-features --exclude-files "src/didcomm/*" --exclude-files "demos/*" --exclude-files "dependencies/one-core/*" --exclude-files "wrappers/*" --fail-under 70 -o Html 2>&1 | tee tarpaulin.log

      - name: Publish coverage summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Coverage"
            echo
            if line=$(grep -oE '[0-9.]+% coverage, [0-9/]+ lines covered' tarpaulin.log | tail -1); then
              echo "**${line}** — gate: 70%"
            else
              echo "No coverage figure produced; tarpaulin did not reach the reporting stage."
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tarpaulin-report
          path: tarpaulin-report.html
          if-no-files-found: warn

  nodejs:
    name: nodejs
    runs-on: ubuntu-latest
    container: node:20.18.0
    timeout-minutes: 60
    needs: [lint-and-build]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rustup
        with:
          rust-version: "1.97.0"
          cache-key: nodejs

      - name: Build the napi wrapper
        run: |
          npm i --prefix wrappers/nodejs
          npm run build --prefix wrappers/nodejs
          npm run build:debug --prefix wrappers/nodejs

      - name: Test the napi wrapper
        run: npm run test --prefix wrappers/nodejs

      - name: Test nodejs against the shared suite
        run: |
          cd wrappers/test/js_common
          npm pkg set dependencies.equs-sdk=file:../../nodejs
          npm i
          npm run test:nodejs

      - name: Build and test the askar plugin wrapper
        run: |
          npm i --prefix plugins/askar/wrappers/nodejs
          npm run build --prefix plugins/askar/wrappers/nodejs
          npm run test --prefix plugins/askar/wrappers/nodejs

  wasm:
    name: wasm
    runs-on: ubuntu-latest
    container: node:20.18.0
    timeout-minutes: 60
    needs: [lint-and-build]
    env:
      RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-wasm
        with:
          rust-version: "1.97.0"
          cache-key: wasm

      - name: Build the wasm wrapper
        run: |
          npm i --prefix wrappers/wasm
          npm run build --prefix wrappers/wasm
          npm run build:dev:cjs --prefix wrappers/wasm

      - name: Test wasm against the shared suite
        run: |
          cd wrappers/test/js_common
          npm pkg set dependencies.equs-sdk=file:../../wasm/pkg
          npm i
          npm run test:wasm

      - name: Build the wasm and nodejs demos
        working-directory: demos/wasm/oid4vc
        run: |
          npm i
          npm run build

  kotlin-test:
    name: kotlin-test
    runs-on: ubuntu-latest
    container: rust:1.97.0-bookworm
    timeout-minutes: 45
    needs: [lint-and-build]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: kotlin-test
      - name: Install JDK 17
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends openjdk-17-jdk
      - working-directory: wrappers/uniffi
        run: make kotlin-test

  swift-test:
    name: swift-test
    runs-on: [self-hosted, macOS]
    timeout-minutes: 60
    needs: [lint-and-build]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rustup
        with:
          rust-version: "1.97.0"
          cache-key: swift-test
      - name: Add Apple targets
        run: rustup target add aarch64-apple-ios x86_64-apple-ios aarch64-apple-ios-sim
      - name: List available simulators
        run: xcrun simctl list devices available
      - working-directory: wrappers/uniffi
        run: make ios-test

  oid4vc-demo:
    name: oid4vc-demo
    runs-on: ubuntu-latest
    container: rust:1.97.0-bookworm
    timeout-minutes: 45
    needs: [test-with-coverage, nodejs, wasm, kotlin-test, swift-test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: oid4vc-demo
      - working-directory: demos/oid4vc
        run: ./demo.sh
