name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RUST_VERSION: "1.97.0"
  NODE_VERSION: "20.18.0"
  RUSTC_WRAPPER: sccache
  SCCACHE_CACHE_SIZE: 1G
  CARGO_INCREMENTAL: "0"

jobs:

  secret-scan:
    name: secret-scan
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install gitleaks
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --proto '=https' --tlsv1.2 -sSfL -o gitleaks.tar.gz "$url"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf gitleaks.tar.gz -C "$RUNNER_TEMP/bin" gitleaks
          chmod +x "$RUNNER_TEMP/bin/gitleaks"
          rm -f gitleaks.tar.gz
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Scan the working tree for secrets
        run: gitleaks dir . --config .github/gitleaks.toml --redact --verbose --exit-code 1 --report-format json --report-path gitleaks-report.json

      - name: Upload gitleaks report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          if-no-files-found: warn

  dependency-scan:
    name: dependency-scan
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rustup
        with:
          rust-version: "1.97.0"
          cache-key: dependency-scan

      - name: Install cargo-audit
        run: bash .github/scripts/binstall-or-build.sh cargo-audit "cargo audit --version"

      - name: Audit dependencies
        shell: bash
        run: |
          cargo audit --json > cargo-audit-report.json || true
          grep -q '"vulnerabilities"' cargo-audit-report.json || { echo "cargo audit produced no report" >&2; exit 1; }

      - name: Publish advisory summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Dependency advisories"
            echo
            echo '```'
            cargo audit --no-fetch 2>&1 | tail -n 60 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cargo-audit-report
          path: cargo-audit-report.json
          if-no-files-found: ignore

  lint-and-format:
    name: lint-and-format
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rustup
        with:
          rust-version: "1.97.0"
          cache-key: lint-and-format
          components: rustfmt clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --exclude wasm --all-targets --all-features -- -Dwarnings

      - name: Report disk
        if: always()
        run: df -h / | tail -1

  build-dev:
    name: build-dev
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [lint-and-format]
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rustup
        with:
          rust-version: "1.97.0"
          cache-key: build-dev

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: target-dev-${{ hashFiles('Cargo.lock') }}
          restore-keys: target-dev-

      - name: Build
        run: cargo build --all-features --workspace --exclude wasm

      - name: Report disk and target size
        if: always()
        run: |
          df -h / | tail -1
          du -sh target 2>/dev/null || true

  build-prod:
    name: build-prod
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [lint-and-format]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rustup
        with:
          rust-version: "1.97.0"
          cache-key: build-prod

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: target-prod-${{ hashFiles('Cargo.lock') }}
          restore-keys: target-prod-

      - name: Build
        run: cargo build --release -p nodejs

      - name: Report disk and target size
        if: always()
        run: |
          df -h / | tail -1
          du -sh target 2>/dev/null || true

  askar-rust:
    name: askar-rust
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [build-prod]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rustup
        with:
          rust-version: "1.97.0"
          cache-key: askar-rust

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: plugins/askar/target
          key: target-askar-${{ hashFiles('Cargo.lock') }}
          restore-keys: target-askar-

      - name: Build the askar crate
        env:
          CARGO_TARGET_DIR: plugins/askar/target
        run: cargo build --release -p askar

      - name: Report disk and target size
        if: always()
        run: |
          df -h / | tail -1
          du -sh plugins/askar/target 2>/dev/null || true

  doc-build:
    name: doc-build
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [build-dev]
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rustup
        with:
          rust-version: "1.97.0"
          cache-key: doc-build
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: target-dev-${{ hashFiles('Cargo.lock') }}
          restore-keys: target-dev-

      - name: Build docs
        run: cargo doc --no-deps --workspace --all-features --exclude nodejs --exclude wasm --exclude equs_sdk_uniffi
        env:
          RUSTDOCFLAGS: -D warnings

  nodejs-wrapper:
    name: nodejs-wrapper
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [build-dev, build-prod]
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20.18.0"
      - uses: ./.github/actions/setup-rustup
        with:
          rust-version: "1.97.0"
          cache-key: nodejs-wrapper
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: target-prod-${{ hashFiles('Cargo.lock') }}
          restore-keys: target-prod-

      - name: Build the napi wrapper
        working-directory: wrappers/nodejs
        run: |
          npm i
          npm run build
          npm run build:debug

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            wrappers/nodejs/node_modules
            wrappers/nodejs/dist
            wrappers/nodejs/*.node
            wrappers/nodejs/binary.js
            wrappers/nodejs/binary.d.ts
            wrappers/nodejs/index.js
            wrappers/nodejs/index.d.ts
          key: wrapper-nodejs-${{ github.sha }}

      - name: Report disk and target size
        if: always()
        run: |
          df -h / | tail -1
          du -sh target 2>/dev/null || true

  wasm-wrapper:
    name: wasm-wrapper
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [build-dev, build-prod]
    env:
      RUSTC_WRAPPER: ""
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20.18.0"
      - uses: ./.github/actions/setup-wasm
        with:
          rust-version: "1.97.0"
          cache-key: wasm-wrapper
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: target-dev-${{ hashFiles('Cargo.lock') }}
          restore-keys: target-dev-

      - name: Build the wasm wrapper
        working-directory: wrappers/wasm
        run: |
          npm i
          npm run build
          npm run build:dev:cjs

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            wrappers/wasm/node_modules
            wrappers/wasm/pkg
            wrappers/wasm/dist
          key: wrapper-wasm-${{ github.sha }}

      - name: Report disk and target size
        if: always()
        run: |
          df -h / | tail -1
          du -sh target 2>/dev/null || true

  uniffi-wrapper:
    name: uniffi-wrapper
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [build-dev, build-prod]
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rustup
        with:
          rust-version: "1.97.0"
          cache-key: uniffi-wrapper
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: target-dev-${{ hashFiles('Cargo.lock') }}
          restore-keys: target-dev-

      - name: Build the uniffi library and generate Kotlin bindings
        working-directory: wrappers/uniffi
        run: make kotlin-generate_kotlin_debug

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/debug/libequssdk.so
            wrappers/uniffi/kotlin/src/main/kotlin
          key: wrapper-uniffi-${{ github.sha }}

      - name: Report disk and target size
        if: always()
        run: |
          df -h / | tail -1
          du -sh target 2>/dev/null || true

  askar-wrapper:
    name: askar-wrapper
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [build-dev, build-prod, askar-rust, nodejs-wrapper]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20.18.0"
      - uses: ./.github/actions/setup-rustup
        with:
          rust-version: "1.97.0"
          cache-key: askar-wrapper
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: plugins/askar/target
          key: target-askar-${{ hashFiles('Cargo.lock') }}
          restore-keys: target-askar-
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            wrappers/nodejs/node_modules
            wrappers/nodejs/dist
            wrappers/nodejs/*.node
            wrappers/nodejs/binary.js
            wrappers/nodejs/binary.d.ts
            wrappers/nodejs/index.js
            wrappers/nodejs/index.d.ts
          key: wrapper-nodejs-${{ github.sha }}

      - name: Build the askar plugin wrapper
        run: |
          npm i --prefix plugins/askar/wrappers/nodejs
          npm run build --prefix plugins/askar/wrappers/nodejs

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            plugins/askar/wrappers/nodejs/node_modules
            plugins/askar/wrappers/nodejs/build
            plugins/askar/wrappers/nodejs/*.node
            plugins/askar/wrappers/nodejs/binary.js
            plugins/askar/wrappers/nodejs/binary.d.ts
          key: wrapper-askar-${{ github.sha }}

      - name: Report disk and target size
        if: always()
        run: |
          df -h / | tail -1
          du -sh plugins/askar/target 2>/dev/null || true

  test-with-coverage:
    name: test-with-coverage
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [build-dev]
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-rustup
        with:
          rust-version: "1.97.0"
          cache-key: test-with-coverage

      - name: Install cargo-tarpaulin
        run: bash .github/scripts/binstall-or-build.sh cargo-tarpaulin "cargo tarpaulin --version"

      - name: Run tests with coverage
        shell: bash
        run: |
          set -o pipefail
          cargo tarpaulin --skip-clean --timeout 180 --all-features --exclude-files "src/didcomm/*" --exclude-files "demos/*" --exclude-files "dependencies/one-core/*" --exclude-files "wrappers/*" --fail-under 70 -o Html 2>&1 | tee tarpaulin.log

      - name: Publish coverage summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Coverage"
            echo
            if line=$(grep -oE '[0-9.]+% coverage, [0-9/]+ lines covered' tarpaulin.log | tail -1); then
              echo "**${line}** — gate: 70%"
            else
              echo "No coverage figure produced; tarpaulin did not reach the reporting stage."
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Report disk and target size
        if: always()
        run: |
          df -h / | tail -1
          du -sh target 2>/dev/null || true

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tarpaulin-report
          path: tarpaulin-report.html
          if-no-files-found: warn

  nodejs-test:
    name: nodejs-test
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [nodejs-wrapper]
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20.18.0"
      - uses: ./.github/actions/setup-rustup
        with:
          rust-version: "1.97.0"
          cache-key: nodejs-test
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            wrappers/nodejs/node_modules
            wrappers/nodejs/dist
            wrappers/nodejs/*.node
            wrappers/nodejs/binary.js
            wrappers/nodejs/binary.d.ts
            wrappers/nodejs/index.js
            wrappers/nodejs/index.d.ts
          key: wrapper-nodejs-${{ github.sha }}

      - name: Test the napi wrapper
        working-directory: wrappers/nodejs
        run: npm run test

      - name: Test nodejs against the shared suite
        working-directory: wrappers/test/js_common
        run: |
          npm pkg set dependencies.equs-sdk=file:../../nodejs
          npm i
          npm run test:nodejs

  askar-plugin-nodejs-test:
    name: askar-plugin-nodejs-test
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [nodejs-wrapper, askar-wrapper]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20.18.0"
      - uses: ./.github/actions/setup-rustup
        with:
          rust-version: "1.97.0"
          cache-key: askar-plugin-nodejs-test
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            wrappers/nodejs/node_modules
            wrappers/nodejs/dist
            wrappers/nodejs/*.node
            wrappers/nodejs/binary.js
            wrappers/nodejs/binary.d.ts
            wrappers/nodejs/index.js
            wrappers/nodejs/index.d.ts
          key: wrapper-nodejs-${{ github.sha }}
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            plugins/askar/wrappers/nodejs/node_modules
            plugins/askar/wrappers/nodejs/build
            plugins/askar/wrappers/nodejs/*.node
            plugins/askar/wrappers/nodejs/binary.js
            plugins/askar/wrappers/nodejs/binary.d.ts
          key: wrapper-askar-${{ github.sha }}

      - name: Test the askar plugin wrapper
        run: npm run test --prefix plugins/askar/wrappers/nodejs

  wasm-test:
    name: wasm-test
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [wasm-wrapper]
    env:
      RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20.18.0"
      - uses: ./.github/actions/setup-rustup
        with:
          rust-version: "1.97.0"
          cache-key: wasm-test
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            wrappers/wasm/node_modules
            wrappers/wasm/pkg
            wrappers/wasm/dist
          key: wrapper-wasm-${{ github.sha }}

      - name: Test wasm against the shared suite
        working-directory: wrappers/test/js_common
        run: |
          npm pkg set dependencies.equs-sdk=file:../../wasm/pkg
          npm i
          npm run test:wasm

  kotlin-test:
    name: kotlin-test
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [uniffi-wrapper]
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rustup
        with:
          rust-version: "1.97.0"
          cache-key: kotlin-test
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: target-dev-${{ hashFiles('Cargo.lock') }}
          restore-keys: target-dev-
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/debug/libequssdk.so
            wrappers/uniffi/kotlin/src/main/kotlin
          key: wrapper-uniffi-${{ github.sha }}

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'

      - working-directory: wrappers/uniffi
        run: make kotlin-test

  swift-test:
    name: swift-test
    runs-on: macos-15
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rustup
        with:
          rust-version: "1.97.0"
          cache-key: swift-test
      - name: Add Apple targets
        run: rustup target add aarch64-apple-ios x86_64-apple-ios aarch64-apple-ios-sim
      - name: List available simulators
        run: |
          df -h /
          xcrun simctl list devices available
      - working-directory: wrappers/uniffi
        run: make ios-test

  demo-build:
    name: demo-build
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [nodejs-wrapper, wasm-wrapper, askar-wrapper]
    env:
      RUSTC_WRAPPER: ""
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20.18.0"
      - uses: ./.github/actions/setup-wasm
        with:
          rust-version: "1.97.0"
          cache-key: demo-build
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: target-dev-${{ hashFiles('Cargo.lock') }}
          restore-keys: target-dev-

      - name: Build the wasm and nodejs demos
        working-directory: demos/wasm/oid4vc
        run: |
          npm i
          npm run build

      - name: Report disk and target size
        if: always()
        run: |
          df -h / | tail -1
          du -sh target 2>/dev/null || true

  oid4vc-demo:
    name: oid4vc-demo
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [build-dev]
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rustup
        with:
          rust-version: "1.97.0"
          cache-key: oid4vc-demo
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: target-dev-${{ hashFiles('Cargo.lock') }}
          restore-keys: target-dev-

      - working-directory: demos/oid4vc
        run: ./demo.sh
