name: CI

# Port of the CI half of .gitlab-ci.yml. The publish/release jobs are
# deliberately absent — CD is out of scope.
# Design: docs/superpowers/specs/2026-08-27-github-actions-ci-design.md

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in sync with the container image literals below. The env context is
  # NOT available to jobs.<id>.container.image, so those cannot interpolate
  # these values and must repeat them.
  RUST_VERSION: "1.97.0"
  NODE_VERSION: "20.18.0"
  RUSTC_WRAPPER: sccache
  SCCACHE_CACHE_SIZE: 2G
  CARGO_INCREMENTAL: "0"

jobs:
  # --- scan -----------------------------------------------------------------
  # Ungated: neither job produces anything the build consumes, so blocking the
  # build on them (as GitLab's stage ordering does) buys nothing.
  #
  # There is no CodeQL job. Code scanning on a private repository requires a
  # paid GitHub Code Security licence, so semgrep-sast (.gitlab-ci.yml:68) has
  # no replacement until the repo goes public. Tracked as W4.4.

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans the full commit history

      - name: Install gitleaks
        run: |
          set -euo pipefail
          # The gitleaks CLI is MIT-licensed and needs no key. The gitleaks
          # *Action* is v2+ EULA-licensed and would require one for an
          # org-owned repo — that licence covers the wrapper, not the scanner.
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --proto '=https' --tlsv1.2 -sSfL -o gitleaks.tar.gz "$url"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf gitleaks.tar.gz -C "$RUNNER_TEMP/bin" gitleaks
          chmod +x "$RUNNER_TEMP/bin/gitleaks"
          rm -f gitleaks.tar.gz
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Scan history for secrets
        run: gitleaks git --redact --verbose --exit-code 1 --report-format json --report-path gitleaks-report.json .

      - name: Upload gitleaks report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          if-no-files-found: warn

  dependency-scan:
    name: dependency-scan
    runs-on: ubuntu-latest
    container: rust:1.97.0-bookworm # RUST_VERSION
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: dependency-scan

      - name: Install cargo-audit
        run: bash .github/scripts/binstall-or-build.sh cargo-audit "cargo audit --version"

      - name: Audit dependencies
        run: cargo audit --json > cargo-audit-report.json

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cargo-audit-report
          path: cargo-audit-report.json
          if-no-files-found: ignore

  # --- lint -----------------------------------------------------------------
  # Hoisted ahead of the build barrier that GitLab imposes: these are cheap and
  # a formatting slip should not cost a full build cycle to surface.

  check-format:
    name: check-format
    runs-on: ubuntu-latest
    container: rust:1.97.0-bookworm # RUST_VERSION
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: check-format
          components: rustfmt
      - run: cargo fmt --all -- --check

  lint:
    name: lint
    runs-on: ubuntu-latest
    container: rust:1.97.0-bookworm # RUST_VERSION
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: lint
          components: clippy
      - run: cargo clippy --workspace --exclude wasm --all-targets --all-features -- -Dwarnings

  # --- build ----------------------------------------------------------------
  # Gated on the lint jobs so a broken build never burns test-stage minutes.

  build:
    name: build
    runs-on: ubuntu-latest
    container: rust:1.97.0-bookworm # RUST_VERSION
    needs: [check-format, lint]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: build
      - run: cargo build --all-features --workspace --exclude wasm

  doc-build:
    name: doc-build
    runs-on: ubuntu-latest
    container: rust:1.97.0-bookworm # RUST_VERSION
    needs: [check-format, lint]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: doc-build
      - run: cargo doc --no-deps --workspace --all-features --exclude nodejs --exclude wasm --exclude equs_sdk_uniffi
        env:
          RUSTDOCFLAGS: -D warnings

  nodejs-wrapper-build:
    name: nodejs-wrapper-build
    runs-on: ubuntu-latest
    container: node:20.18.0 # NODE_VERSION
    needs: [check-format, lint]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rustup
        with:
          rust-version: "1.97.0" # RUST_VERSION
          cache-key: nodejs-wrapper-build
      - working-directory: wrappers/nodejs
        run: |
          npm i
          npm run build

  nodejs-demo-build:
    name: nodejs-demo-build
    runs-on: ubuntu-latest
    container: node:20.18.0 # NODE_VERSION
    needs: [check-format, lint]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rustup
        with:
          rust-version: "1.97.0" # RUST_VERSION
          cache-key: nodejs-demo-build
      - working-directory: demos/nodejs/oid4vc
        run: |
          npm i
          npm run build

  wasm-wrapper-build:
    name: wasm-wrapper-build
    runs-on: ubuntu-latest
    container: node:20.18.0 # NODE_VERSION
    needs: [check-format, lint]
    env:
      RUSTC_WRAPPER: "" # sccache is disabled for wasm builds, as on GitLab
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-wasm
        with:
          rust-version: "1.97.0" # RUST_VERSION
          cache-key: wasm-wrapper-build
      - working-directory: wrappers/wasm
        run: |
          npm i
          npm run build

  wasm-demo-build:
    name: wasm-demo-build
    runs-on: ubuntu-latest
    container: node:20.18.0 # NODE_VERSION
    needs: [check-format, lint]
    env:
      RUSTC_WRAPPER: "" # sccache is disabled for wasm builds, as on GitLab
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-wasm
        with:
          rust-version: "1.97.0" # RUST_VERSION
          cache-key: wasm-demo-build
      - working-directory: demos/wasm/oid4vc
        run: |
          npm i
          npm run build

  # --- test -----------------------------------------------------------------

  test-with-coverage:
    name: test-with-coverage
    runs-on: ubuntu-latest
    container: rust:1.97.0-bookworm # RUST_VERSION
    needs: [build, doc-build, nodejs-wrapper-build, wasm-wrapper-build, nodejs-demo-build, wasm-demo-build]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: test-with-coverage

      - name: Install cargo-tarpaulin
        run: bash .github/scripts/binstall-or-build.sh cargo-tarpaulin "cargo tarpaulin --version"

      # GitLab's `coverage:` regex has no GitHub equivalent absent a
      # third-party service, so it is dropped. --fail-under 70 is the actual
      # enforcement and is preserved exactly.
      - name: Run tests with coverage
        run: cargo tarpaulin --skip-clean --timeout 180 --all-features --exclude-files "src/didcomm/*" --exclude-files "demos/*" --exclude-files "dependencies/one-core/*" --exclude-files "wrappers/*" --fail-under 70 -o Html

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tarpaulin-report
          path: tarpaulin-report.html
          if-no-files-found: error

  nodejs-test:
    name: nodejs-test
    runs-on: ubuntu-latest
    container: node:20.18.0 # NODE_VERSION
    needs: [build, doc-build, nodejs-wrapper-build, wasm-wrapper-build, nodejs-demo-build, wasm-demo-build]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rustup
        with:
          rust-version: "1.97.0" # RUST_VERSION
          cache-key: nodejs-test
      - name: Build and test the napi wrapper
        run: |
          cd wrappers/nodejs
          npm i
          npm run build:debug
          npm run test
          cd ../test/js_common
          npm pkg set dependencies.equs-sdk=file:../../nodejs
          npm i
          npm run test:nodejs

  askar-plugin-nodejs-test:
    name: askar-plugin-nodejs-test
    runs-on: ubuntu-latest
    container: node:20.18.0 # NODE_VERSION
    needs: [build, doc-build, nodejs-wrapper-build, wasm-wrapper-build, nodejs-demo-build, wasm-demo-build]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rustup
        with:
          rust-version: "1.97.0" # RUST_VERSION
          cache-key: askar-plugin-nodejs-test
      - name: Build and test the askar plugin wrapper
        run: |
          npm i --prefix wrappers/nodejs
          npm run build:debug --prefix wrappers/nodejs
          npm i --prefix plugins/askar/wrappers/nodejs
          npm run build --prefix plugins/askar/wrappers/nodejs
          npm run test --prefix plugins/askar/wrappers/nodejs

  wasm-test:
    name: wasm-test
    runs-on: ubuntu-latest
    container: node:20.18.0 # NODE_VERSION
    needs: [build, doc-build, nodejs-wrapper-build, wasm-wrapper-build, nodejs-demo-build, wasm-demo-build]
    env:
      RUSTC_WRAPPER: "" # sccache is disabled for wasm builds, as on GitLab
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-wasm
        with:
          rust-version: "1.97.0" # RUST_VERSION
          cache-key: wasm-test
      - name: Build and test the wasm wrapper
        run: |
          cd wrappers/wasm
          npm install
          npm run build:dev:cjs
          cd ../test/js_common
          npm pkg set dependencies.equs-sdk=file:../../wasm/pkg
          npm i
          npm run test:wasm

  kotlin-test:
    name: kotlin-test
    runs-on: ubuntu-latest
    container: rust:1.97.0-bookworm # RUST_VERSION
    needs: [build, doc-build, nodejs-wrapper-build, wasm-wrapper-build, nodejs-demo-build, wasm-demo-build]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: kotlin-test
      - name: Install JDK 17
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends openjdk-17-jdk
      - working-directory: wrappers/uniffi
        run: make kotlin-test

  swift-test:
    name: swift-test
    # Self-hosted: macOS minutes on GitHub-hosted runners bill at ~10x Linux,
    # and self-hosted runners are unbilled. Mirrors GitLab's macosrunner2 tag.
    # No container — macOS runners cannot run Linux containers.
    runs-on: [self-hosted, macOS]
    needs: [build, doc-build, nodejs-wrapper-build, wasm-wrapper-build, nodejs-demo-build, wasm-demo-build]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rustup
        with:
          rust-version: "1.97.0" # RUST_VERSION
          cache-key: swift-test
      - name: Add Apple targets
        run: rustup target add aarch64-apple-ios x86_64-apple-ios aarch64-apple-ios-sim
      - name: List available simulators
        run: xcrun simctl list devices available
      - working-directory: wrappers/uniffi
        run: make ios-test

  # --- demo -----------------------------------------------------------------

  oid4vc-demo:
    name: oid4vc-demo
    runs-on: ubuntu-latest
    container: rust:1.97.0-bookworm # RUST_VERSION
    needs: [test-with-coverage, nodejs-test, askar-plugin-nodejs-test, wasm-test, kotlin-test, swift-test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: oid4vc-demo
      - working-directory: demos/oid4vc
        run: ./demo.sh
