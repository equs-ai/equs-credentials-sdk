name: Publish askar Node.js wrapper

on:
  push:
    tags: ['askar-nodejs/v[0-9]*.[0-9]*.[0-9]*']
  workflow_call:
    inputs:
      version:
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: publish-askar-nodejs
  cancel-in-progress: false

env:
  RUST_VERSION: "1.97.0"
  NODE_VERSION: "20.18.0"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  REGISTRY_URL_NPM: https://registry.npmjs.org/
  npm_config_access: public

jobs:
  askar-target-linux:
    runs-on: ubuntu-latest
    environment: npmjs
    container:
      image: rust:1.97.0-bookworm
    timeout-minutes: 60
    env:
      ENVIRONMENT: production
      TARGET: x86_64-unknown-linux-gnu
      ALIAS: linux-x64-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/npm-version
        id: version
        with:
          prefix: askar-nodejs
          version: ${{ inputs.version }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: ./.github/actions/setup-rustup
        with:
          rust-version: ${{ env.RUST_VERSION }}
          cache-key: publish-askar-nodejs
          tooling: 'false'

      - name: Build and publish
        shell: bash
        env:
          NPM_TOKEN: ${{ secrets.EQUS_CREDENTIALS_SDK_NPM_TOKEN }}
        working-directory: plugins/askar/wrappers/nodejs
        run: bash scripts/build_and_publish_target.sh

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-askar-nodejs-linux-x64-gnu
          path: plugins/askar/wrappers/nodejs/npm/linux-x64-gnu/*.tgz
          if-no-files-found: error

  askar-target-darwin:
    runs-on: macos-15
    environment: npmjs
    timeout-minutes: 60
    strategy:
      matrix:
        include:
          - {target: aarch64-apple-darwin, alias: darwin-arm64}
          - {target: x86_64-apple-darwin, alias: darwin-x64}
    env:
      ENVIRONMENT: production
      TARGET: ${{ matrix.target }}
      ALIAS: ${{ matrix.alias }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/npm-version
        id: version
        with:
          prefix: askar-nodejs
          version: ${{ inputs.version }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: ./.github/actions/setup-rustup
        with:
          rust-version: ${{ env.RUST_VERSION }}
          cache-key: publish-askar-nodejs
          tooling: 'false'

      - name: Build and publish
        shell: bash
        env:
          NPM_TOKEN: ${{ secrets.EQUS_CREDENTIALS_SDK_NPM_TOKEN }}
        working-directory: plugins/askar/wrappers/nodejs
        run: bash scripts/build_and_publish_target.sh

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-askar-nodejs-${{ matrix.alias }}
          path: plugins/askar/wrappers/nodejs/npm/${{ matrix.alias }}/*.tgz
          if-no-files-found: error

  askar-wrapper:
    needs: [askar-target-linux, askar-target-darwin]
    runs-on: ubuntu-latest
    environment: npmjs
    container:
      image: rust:1.97.0-bookworm
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      ENVIRONMENT: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/npm-version
        id: version
        with:
          prefix: askar-nodejs
          version: ${{ inputs.version }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: ./.github/actions/setup-rustup
        with:
          rust-version: ${{ env.RUST_VERSION }}
          cache-key: publish-askar-nodejs
          tooling: 'false'

      - name: Build the SDK wrapper
        shell: bash
        working-directory: wrappers/nodejs
        run: |
          npm i
          npm run build

      - name: Build and publish
        shell: bash
        env:
          NPM_TOKEN: ${{ secrets.EQUS_CREDENTIALS_SDK_NPM_TOKEN }}
        working-directory: plugins/askar/wrappers/nodejs
        run: bash scripts/build_and_publish_wrapper.sh

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-askar-nodejs-wrapper
          path: plugins/askar/wrappers/nodejs/*.tgz
          if-no-files-found: error

  manifest:
    needs: [askar-target-linux, askar-target-darwin, askar-wrapper]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: npm-askar-nodejs-*
          path: tarballs

      - name: Render manifest
        shell: bash
        env:
          CI_COMMIT_TAG: ${{ github.ref_name }}
          CI_COMMIT_SHA: ${{ github.sha }}
          RELEASE_VERSION: ${{ needs.askar-wrapper.outputs.version }}
        run: |
          bash scripts/npm_release_manifest.sh @equs-ai/equs-credentials-sdk-askar-storage release-manifest.yaml tarballs \
            @equs-ai/equs-credentials-sdk-askar-storage \
            @equs-ai/equs-credentials-sdk-askar-storage-linux-x64-gnu \
            @equs-ai/equs-credentials-sdk-askar-storage-darwin-arm64 \
            @equs-ai/equs-credentials-sdk-askar-storage-darwin-x64

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-manifest-askar-nodejs
          path: release-manifest.yaml
          if-no-files-found: error

      - if: ${{ !inputs.version }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1 ||
            gh release create "$TAG" --repo "$REPO" --title "$TAG" --notes ""
          gh release upload "$TAG" release-manifest.yaml --repo "$REPO" --clobber

  summary:
    needs: [askar-wrapper]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - shell: bash
        env:
          VERSION: ${{ needs.askar-wrapper.outputs.version }}
        run: |
          printf "### Published to npmjs\n\n" >> "$GITHUB_STEP_SUMMARY"
          for p in equs-credentials-sdk-askar-storage equs-credentials-sdk-askar-storage-linux-x64-gnu equs-credentials-sdk-askar-storage-darwin-arm64 equs-credentials-sdk-askar-storage-darwin-x64; do
            printf -- "- \`@equs-ai/%s@%s\`\n" "$p" "$VERSION" >> "$GITHUB_STEP_SUMMARY"
          done
