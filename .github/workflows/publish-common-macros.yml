name: Publish common-macros

on:
  push:
    tags: ['common-macros/v[0-9]*.[0-9]*.[0-9]*']

permissions:
  contents: read

concurrency:
  group: publish-common-macros
  cancel-in-progress: false

env:
  RUST_VERSION: "1.97.0"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: crates-io
    container:
      image: rust:1.97.0-bookworm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-rustup
        with:
          rust-version: ${{ env.RUST_VERSION }}
          cache-key: publish-common-macros
          tooling: 'false'

      - name: Resolve version
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          [[ "$tag" =~ ^common-macros/v([0-9]+\.[0-9]+\.[0-9]+)$ ]] || { echo "tag '$tag' is not common-macros/vX.Y.Z" >&2; exit 1; }
          tag_version="${BASH_REMATCH[1]}"
          version=$(awk '/^\[package\]/{p=1;next} /^\[/{p=0} p&&/^version[[:space:]]*=/{gsub(/["[:space:]]/,"");sub(/^version=/,"");print;exit}' equs-common-macros/Cargo.toml)
          [ "$tag_version" = "$version" ] || { echo "tag '$tag' does not match equs-common-macros/Cargo.toml version '$version'" >&2; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Package
        shell: bash
        run: cargo package --locked -p equs-common-macros

      - name: Publish
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "${CARGO_REGISTRY_TOKEN:-}" ] || { echo "CARGO_REGISTRY_TOKEN is not set" >&2; exit 1; }
          cargo publish --locked --no-verify -p equs-common-macros

      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: common-macros-package
          path: target/package/*.crate
          if-no-files-found: warn

      - shell: bash
        run: printf "### Published\n\n\`equs-common-macros %s\` to crates.io\n" "$VERSION" >> "$GITHUB_STEP_SUMMARY"
