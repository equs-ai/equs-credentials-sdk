name: Publish common-macros

on:
  push:
    tags: ['common-macros/v[0-9]*.[0-9]*.[0-9]*']

permissions:
  contents: read

concurrency:
  group: publish-common-macros
  cancel-in-progress: false

env:
  RUST_VERSION: "1.97.0"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: crates-io
    container:
      image: rust:1.97.0-bookworm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-rustup
        with:
          rust-version: ${{ env.RUST_VERSION }}
          cache-key: publish-common-macros
          tooling: 'false'

      - name: Resolve version
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          [[ "$tag" =~ ^common-macros/v([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?)$ ]] || { echo "tag '$tag' is not common-macros/vX.Y.Z or common-macros/vX.Y.Z-PRERELEASE" >&2; exit 1; }
          tag_version="${BASH_REMATCH[1]}"
          version=$(awk '/^\[package\]/{p=1;next} /^\[/{p=0} p&&/^version[[:space:]]*=/{gsub(/["[:space:]]/,"");sub(/^version=/,"");print;exit}' equs-common-macros/Cargo.toml)
          [ "$tag_version" = "$version" ] || { echo "tag '$tag' does not match equs-common-macros/Cargo.toml version '$version'" >&2; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Package
        shell: bash
        run: cargo package --locked -p equs-common-macros

      - name: Publish
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.EQUS_CREDENTIALS_SDK_CRATES_IO_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "${CARGO_REGISTRY_TOKEN:-}" ] || { echo "org secret EQUS_CREDENTIALS_SDK_CRATES_IO_TOKEN is unset or not visible to this repo" >&2; exit 1; }
          cargo publish --locked --no-verify -p equs-common-macros

      - name: Render manifest
        if: always()
        shell: bash
        env:
          CI_COMMIT_TAG: ${{ github.ref_name }}
          CI_COMMIT_SHA: ${{ github.sha }}
          RELEASE_VERSION: ${{ env.VERSION }}
        run: |
          set -euo pipefail
          apt-get update && apt-get install -y jq
          bash scripts/release_manifest.sh equs-common-macros release-manifest.yaml

      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-manifest
          path: release-manifest.yaml
          if-no-files-found: error

      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: common-macros-package
          path: target/package/*.crate
          if-no-files-found: warn

      - shell: bash
        run: printf "### Published\n\n\`equs-common-macros %s\` to crates.io\n" "$VERSION" >> "$GITHUB_STEP_SUMMARY"

  manifest:
    needs: publish
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-manifest

      - shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1 ||
            gh release create "$TAG" --repo "$REPO" --title "$TAG" --notes ""
          gh release upload "$TAG" release-manifest.yaml --repo "$REPO" --clobber
