name: Publish npm

on:
  push:
    tags: ['npm/v[0-9]*.[0-9]*.[0-9]*']

permissions:
  contents: read

concurrency:
  group: publish-npm
  cancel-in-progress: false

env:
  RUST_VERSION: "1.97.0"
  NODE_VERSION: "20.18.0"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  REGISTRY_URL_NPM: https://registry.npmjs.org/
  npm_config_access: public

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      environment: ${{ steps.resolve.outputs.environment }}
      dist-tag: ${{ steps.resolve.outputs.dist-tag }}
    steps:
      - id: resolve
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#npm/v}"
          if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf 'environment=production\ndist-tag=latest\n' >> "$GITHUB_OUTPUT"
          elif [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z.-]+$ ]]; then
            printf 'environment=development\ndist-tag=dev\n' >> "$GITHUB_OUTPUT"
          else
            echo "tag '$GITHUB_REF_NAME' is not npm/vX.Y.Z[-suffix]" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  nodejs-target-linux:
    needs: [version]
    runs-on: ubuntu-latest
    environment: npmjs
    container:
      image: rust:1.97.0-bookworm
    timeout-minutes: 60
    env:
      CI_COMMIT_TAG: ${{ needs.version.outputs.version }}
      ENVIRONMENT: ${{ needs.version.outputs.environment }}
      NPM_TOKEN: ${{ secrets.EQUS_CREDENTIALS_SDK_NPM_TOKEN }}
      TARGET: x86_64-unknown-linux-gnu
      ALIAS: linux-x64-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: ./.github/actions/setup-rustup
        with:
          rust-version: ${{ env.RUST_VERSION }}
          cache-key: publish-npm
          tooling: 'false'

      - name: Build and publish
        shell: bash
        working-directory: wrappers/nodejs
        run: bash scripts/build_and_publish_target.sh

  nodejs-target-darwin:
    needs: [version]
    runs-on: macos-15
    environment: npmjs
    timeout-minutes: 60
    strategy:
      matrix:
        include:
          - {target: aarch64-apple-darwin, alias: darwin-arm64}
          - {target: x86_64-apple-darwin, alias: darwin-x64}
    env:
      CI_COMMIT_TAG: ${{ needs.version.outputs.version }}
      ENVIRONMENT: ${{ needs.version.outputs.environment }}
      NPM_TOKEN: ${{ secrets.EQUS_CREDENTIALS_SDK_NPM_TOKEN }}
      TARGET: ${{ matrix.target }}
      ALIAS: ${{ matrix.alias }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: ./.github/actions/setup-rustup
        with:
          rust-version: ${{ env.RUST_VERSION }}
          cache-key: publish-npm
          tooling: 'false'

      - name: Build and publish
        shell: bash
        working-directory: wrappers/nodejs
        run: bash scripts/build_and_publish_target.sh

  nodejs-wrapper:
    needs: [version, nodejs-target-linux, nodejs-target-darwin]
    runs-on: ubuntu-latest
    environment: npmjs
    container:
      image: rust:1.97.0-bookworm
    timeout-minutes: 60
    env:
      CI_COMMIT_TAG: ${{ needs.version.outputs.version }}
      ENVIRONMENT: ${{ needs.version.outputs.environment }}
      NPM_TOKEN: ${{ secrets.EQUS_CREDENTIALS_SDK_NPM_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: ./.github/actions/setup-rustup
        with:
          rust-version: ${{ env.RUST_VERSION }}
          cache-key: publish-npm
          tooling: 'false'

      - name: Build and publish
        shell: bash
        working-directory: wrappers/nodejs
        run: |
          npm pkg delete scripts.postinstall
          bash scripts/build_and_publish_wrapper.sh

  wasm:
    needs: [version]
    runs-on: ubuntu-latest
    environment: npmjs
    container:
      image: rust:1.97.0-bookworm
    timeout-minutes: 60
    env:
      CI_COMMIT_TAG: ${{ needs.version.outputs.version }}
      NPM_TOKEN: ${{ secrets.EQUS_CREDENTIALS_SDK_NPM_TOKEN }}
      BUILD_SCRIPT: ${{ needs.version.outputs.environment == 'production' && 'build' || 'build:dev' }}
      DIST_TAG: ${{ needs.version.outputs.dist-tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: ./.github/actions/setup-rustup
        with:
          rust-version: ${{ env.RUST_VERSION }}
          cache-key: publish-npm
          tooling: 'false'

      - name: Install wasm tooling
        shell: bash
        run: |
          command -v clang >/dev/null || { apt-get update && apt-get install -y --no-install-recommends clang; }
          bash .github/scripts/install-wasm-pack.sh

      - name: Build and publish
        shell: bash
        working-directory: wrappers/wasm
        run: |
          set -euo pipefail
          [ -n "${NPM_TOKEN:-}" ] || { echo "org secret EQUS_CREDENTIALS_SDK_NPM_TOKEN is unset or not visible to this repo" >&2; exit 1; }
          npm i
          npm run "$BUILD_SCRIPT"
          printf '%s:_authToken=%s\n' "//${REGISTRY_URL_NPM#*://}" "$NPM_TOKEN" >> "$HOME/.npmrc"
          chmod 600 "$HOME/.npmrc"
          cp .npmignore pkg/.npmignore
          cd pkg
          npm publish --registry="$REGISTRY_URL_NPM" --tag "$DIST_TAG"

  summary:
    needs: [version, nodejs-wrapper, wasm]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
          DIST_TAG: ${{ needs.version.outputs.dist-tag }}
        run: |
          printf "### Published to npmjs (\`%s\`)\n\n" "$DIST_TAG" >> "$GITHUB_STEP_SUMMARY"
          for p in equs-credentials-sdk equs-credentials-sdk-linux-x64-gnu equs-credentials-sdk-darwin-arm64 equs-credentials-sdk-darwin-x64 equs-credentials-sdk-wasm; do
            printf -- "- \`@equs-ai/%s@%s\`\n" "$p" "$VERSION" >> "$GITHUB_STEP_SUMMARY"
          done
