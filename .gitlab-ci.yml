include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml
  - local: "wrappers/nodejs/publish.yml"
  - local: "wrappers/wasm/publish.yml"
  - local: "wrappers/uniffi/publish.yml"
  - local: "plugins/askar/wrappers/nodejs/publish.yml"

stages:
  - scan
  - build
  - lint
  - test
  - demo
  - release
  - manifest

variables:
  RUST_VERSION: "1.97.0"
  NODE_VERSION: "20.18.0"
  VERSION_REGEX: /^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$/
  RELEASE_VERSION_REGEX: /^[0-9]+\.[0-9]+\.[0-9]+$/
  PRERELEASE_VERSION_REGEX: /^[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z.-]+$/
  RUSTC_WRAPPER: "sccache"
  SCCACHE_DIR: "${CI_PROJECT_DIR}/.sccache"
  SCCACHE_CACHE_SIZE: "2G"
  CARGO_INCREMENTAL: "0"
  npm_config_cache: "${CI_PROJECT_DIR}/.npm"


.ci_cache: &ci_cache
  - key: sccache
    paths:
      - .sccache
  - key: npm
    paths:
      - .npm

.rust_tooling_script: &rust_tooling_script
  - curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
  - RUSTC_WRAPPER="" cargo binstall -y sccache
  - |
    binstall_or_build() {
      cargo binstall -y "$1" && eval "$2" >/dev/null 2>&1 || { echo "prebuilt for $1 unusable — building from source"; cargo install --force "$1"; }
    }

.rust_job_configs: &rust_job_configs
  image: rust:${RUST_VERSION}-bookworm
  cache: *ci_cache
  before_script:
    - *rust_tooling_script


.swift_job_configs: &swift_job_configs
  cache: *ci_cache
  before_script:
    - curl https://sh.rustup.rs -sSf | sh -s -- -y --default-toolchain ${RUST_VERSION}
    - source "$HOME/.cargo/env"
    - *rust_tooling_script

.nodejs_job_configs: &nodejs_job_configs
  image: node:${NODE_VERSION}
  cache: *ci_cache
  before_script:
    - curl https://sh.rustup.rs -sSf | sh -s -- -y --default-toolchain ${RUST_VERSION}
    - source "$HOME/.cargo/env"
    - *rust_tooling_script

semgrep-sast:
  stage: scan
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_REF_NAME == "main"'
      changes:
        - '**/*.rs'

secret_detection:
  stage: scan
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_REF_NAME == "main"'
      changes:
        - '**/*'

dependency_scanning:
  <<: *rust_job_configs
  stage: scan
  script:
    - binstall_or_build gitlab-cargo-audit "gitlab-cargo-audit --version"
    - gitlab-cargo-audit --output-path gl-dependency-scanning-report.json
  artifacts:
    when: always
    reports:
      dependency_scanning: gl-dependency-scanning-report.json
  only:
    - merge_requests
    - main


build-job:
  <<: *rust_job_configs
  stage: build
  script:
    - cargo build --all-features --workspace --exclude wasm
  only:
    - merge_requests
    - main

nodejs-wrapper-build-job:
  <<: *nodejs_job_configs
  stage: build
  script:
    - cd wrappers/nodejs
    - npm i
    - npm run build
  only:
    - merge_requests
    - main
wasm-wrapper-build-job:
  image: cimg/node:${NODE_VERSION}-browsers
  cache: *ci_cache
  variables:
    RUSTC_WRAPPER: ""
  before_script:
    - curl https://sh.rustup.rs -sSf | sh -s -- -y --default-toolchain ${RUST_VERSION}
    - source "$HOME/.cargo/env"
    - *rust_tooling_script
    - sudo apt-get update
    - sudo apt-get install -y clang
    - for i in 1 2 3; do curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh && break || { echo "wasm-pack install failed (attempt $i), retrying"; sleep 15; }; done
    - sudo chown -R "$(id -u):$(id -g)" "$npm_config_cache" "$SCCACHE_DIR" 2>/dev/null || true
  stage: build
  script:
    - cd wrappers/wasm
    - npm i
    - npm run build
  only:
    - merge_requests
    - main

nodejs-demo-build-job:
  <<: *nodejs_job_configs
  stage: build
  script:
    - cd demos/nodejs/oid4vc
    - npm i
    - npm run build
  only:
    - merge_requests
    - main

wasm-demo-build-job:
  image: cimg/node:${NODE_VERSION}-browsers
  cache: *ci_cache
  variables:
    RUSTC_WRAPPER: ""
  before_script:
    - curl https://sh.rustup.rs -sSf | sh -s -- -y --default-toolchain ${RUST_VERSION}
    - source "$HOME/.cargo/env"
    - *rust_tooling_script
    - sudo apt-get update
    - sudo apt-get install -y clang
    - for i in 1 2 3; do curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh && break || { echo "wasm-pack install failed (attempt $i), retrying"; sleep 15; }; done
    - sudo chown -R "$(id -u):$(id -g)" "$npm_config_cache" "$SCCACHE_DIR" 2>/dev/null || true
  stage: build
  script:
    - cd demos/wasm/oid4vc
    - npm i
    - npm run build
  only:
    - merge_requests
    - main

doc-build-job:
  <<: *rust_job_configs
  stage: build
  script:
    - RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --workspace --all-features --exclude nodejs --exclude wasm --exclude equs_sdk_uniffi
  only:
    - merge_requests
    - main


check-format-job:
  <<: *rust_job_configs
  stage: lint
  script:
    - rustup component add rustfmt
    - cargo fmt --all -- --check
  only:
    - merge_requests
    - main

lint-job:
  <<: *rust_job_configs
  stage: lint
  script:
    - rustup component add clippy
    - cargo clippy --workspace --exclude wasm --all-targets --all-features -- -Dwarnings
  only:
    - merge_requests
    - main


test-with-coverage-job:
  <<: *rust_job_configs
  stage: test
  script:
    - binstall_or_build cargo-tarpaulin "cargo tarpaulin --version"
    - cargo tarpaulin --skip-clean --timeout 180 --all-features --exclude-files "src/didcomm/*" --exclude-files "demos/*" --exclude-files "dependencies/one-core/*" --exclude-files "wrappers/*" --exclude-files "test-fixtures/*" --fail-under 70 -o Html
  coverage: '/^\d+.\d+% coverage/'
  artifacts:
    paths:
      - tarpaulin-report.html
  only:
    - merge_requests
    - main

common-macros-test-job:
  <<: *rust_job_configs
  stage: test
  script:
    - cargo test -p equs-common-macros
  only:
    - merge_requests
    - main

test-fixtures-test-job:
  <<: *rust_job_configs
  stage: test
  script:
    - cargo test --all-features -p equs-test-fixtures
  only:
    - merge_requests
    - main

nodejs-test-job:
  <<: *nodejs_job_configs
  stage: test
  script:
    - cd wrappers/nodejs
    - npm i
    - npm run build:debug
    - npm run test
    - cd ../test/js_common
    - npm pkg set dependencies.equs-credentials-sdk=file:../../nodejs
    - npm i
    - npm run test:nodejs
  only:
    - merge_requests
    - main

askar-plugin-nodejs-test-job:
  <<: *nodejs_job_configs
  stage: test
  script:
    - npm i --prefix wrappers/nodejs
    - npm run build:debug --prefix wrappers/nodejs
    - npm i --prefix plugins/askar/wrappers/nodejs
    - npm run build --prefix plugins/askar/wrappers/nodejs
    - npm run test --prefix plugins/askar/wrappers/nodejs
  only:
    - merge_requests
    - main

wasm-test-job:
  image: cimg/node:${NODE_VERSION}-browsers
  cache: *ci_cache
  variables:
    RUSTC_WRAPPER: ""
  before_script:
    - curl https://sh.rustup.rs -sSf | sh -s -- -y --default-toolchain ${RUST_VERSION}
    - source "$HOME/.cargo/env"
    - *rust_tooling_script
    - sudo apt-get update
    - sudo apt-get install -y clang
    - for i in 1 2 3; do curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh && break || { echo "wasm-pack install failed (attempt $i), retrying"; sleep 15; }; done
    - sudo chown -R "$(id -u):$(id -g)" "$npm_config_cache" "$SCCACHE_DIR" 2>/dev/null || true
  stage: test
  script:
    - cd wrappers/wasm
    - npm install
    - npm run build:dev:cjs
    - cd ../test/js_common
    - npm pkg set dependencies.equs-credentials-sdk=file:../../wasm/pkg
    - npm i
    - npm run test:wasm
  only:
    - merge_requests
    - main

kotlin-test-job:
  <<: *rust_job_configs
  stage: test
  script:
    - apt-get update
    - apt-get install -y openjdk-17-jdk
    - cd wrappers/uniffi
    - make kotlin-test
  only:
    - merge_requests
    - main

swift-test-job:
  <<: *swift_job_configs
  stage: test
  script:
    - rustup target add aarch64-apple-ios x86_64-apple-ios aarch64-apple-ios-sim
    - xcrun simctl list devices available
    - cd wrappers/uniffi
    - make ios-test
  tags:
    - macosrunner2
  only:
    - merge_requests
    - main


oid4vc-demo-job:
  <<: *rust_job_configs
  stage: demo
  script:
    - cd ./demos/oid4vc
    - ./demo.sh
  only:
    - merge_requests
    - main


release_artifacts_job:
  <<: *rust_job_configs
  stage: release
  script:
    - binstall_or_build cargo-sbom "cargo sbom --version"
    - binstall_or_build cargo-audit "cargo audit --version"
    - cargo sbom &>  SBOM.auto.out
    - cargo audit &> AUDIT.auto.out || true
    - cargo doc --no-deps
    - tar -cvz -f API.auto.tar.gz target/doc/equs_sdk/
  artifacts:
    paths:
      - SBOM.auto.out
      - AUDIT.auto.out
      - API.auto.tar.gz
  rules:
    - if: $CI_COMMIT_TAG && $CI_COMMIT_TAG =~ $VERSION_REGEX
      when: always
    - when: never


release_manifest_job:
  image: rust:${RUST_VERSION}-bookworm
  stage: manifest
  dependencies: []
  variables:
    RUSTC_WRAPPER: ""
  before_script:
    - apt-get update && apt-get install -y jq
  script:
    - bash scripts/release_manifest.sh equs-credentials-sdk release-manifest.yaml
    - cat release-manifest.yaml
  artifacts:
    paths:
      - release-manifest.yaml
  rules:
    - if: $CI_COMMIT_TAG && $CI_COMMIT_TAG =~ $VERSION_REGEX
      when: always
    - when: never