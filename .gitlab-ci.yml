stages:
  - lint
  - test
  - build

default:
  image: rust:1.79.0
  before_script:
    - sed -i "s|ssh://git@git.slock.it/|https://gitlab-ci-token:${CI_JOB_TOKEN}@git.slock.it/|" Cargo.toml

lint-job:
  stage: lint
  script:
    - rustup component add rustfmt
    - rustup component add clippy
    - cargo fmt --all
    - cargo clippy --workspace --all-targets --all-features -- -Dwarnings
  only:
    - merge_requests
    - main

test-job:
  stage: test
  script:
    - cargo build --all-features
    - cargo test --all-features
  only:
    - merge_requests
    - main

doc-build-job:
  stage: build
  script:
    - cargo doc --no-deps
  only:
    - merge_requests
    - main

oid4vc-demo-build-job:
  stage: build
  script:
    - cargo build --manifest-path=demos/oid4vc/Cargo.toml
    - cargo build --manifest-path=demos/oid4vc/holder/Cargo.toml
  only:
    - merge_requests
    - main

multi-thread-demo-build-job:
  stage: build
  script:
    - cargo build --manifest-path=demos/multi-thread/Cargo.toml
  only:
    - merge_requests
    - main