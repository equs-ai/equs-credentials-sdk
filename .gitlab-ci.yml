include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml
  - local: "wrappers/nodejs/publish.yml"
  - local: "wrappers/wasm/publish.yml"
  - local: "wrappers/uniffi/publish.yml"
  - local: "plugins/askar/wrappers/nodejs/publish.yml"

stages:
  - scan
  - build
  - lint
  - test
  - demo
  - release

variables:
  RUST_VERSION: "1.89.0"
  NODE_VERSION: "20.18.0"
  VERSION_REGEX: /^[0-9]+\.[0-9]+\.[0-9]+$/


# Shared configurations

.cargo_local_deps_script: &cargo_local_deps_script
  - |
    if [[ "$OSTYPE" == "darwin"* ]]; then
    sed -i '' "s|ssh://git@git.slock.it/|https://gitlab-ci-token:${CI_JOB_TOKEN}@git.slock.it/|" Cargo.toml
    else
    sed -i "s|ssh://git@git.slock.it/|https://gitlab-ci-token:${CI_JOB_TOKEN}@git.slock.it/|" Cargo.toml
    fi

.rust_job_configs: &rust_job_configs
  image: rust:${RUST_VERSION}-bookworm
  before_script:
    - *cargo_local_deps_script


.swift_job_configs: &swift_job_configs
  before_script:
    - curl https://sh.rustup.rs -sSf | sh -s -- -y --default-toolchain ${RUST_VERSION}
    - source "$HOME/.cargo/env"
    - *cargo_local_deps_script

.nodejs_job_configs: &nodejs_job_configs
  image: node:${NODE_VERSION}
  before_script:
    - curl https://sh.rustup.rs -sSf | sh -s -- -y --default-toolchain ${RUST_VERSION}
    - source "$HOME/.cargo/env"
    - *cargo_local_deps_script

semgrep-sast:
  stage: scan
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_REF_NAME == "main"'
      changes:
        - '**/*.rs'

secret_detection:
  stage: scan
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_REF_NAME == "main"'
      changes:
        - '**/*'

dependency_scanning:
  <<: *rust_job_configs
  stage: scan
  script:
    - cargo install gitlab-cargo-audit
    - gitlab-cargo-audit --output-path gl-dependency-scanning-report.json
  artifacts:
    when: always
    reports:
      dependency_scanning: gl-dependency-scanning-report.json
  only:
    - merge_requests
    - main

# Build stage

build-job:
  <<: *rust_job_configs
  stage: build
  script:
    - cargo build --all-features --workspace --exclude wasm
  only:
    - merge_requests
    - main

nodejs-wrapper-build-job:
  <<: *nodejs_job_configs
  stage: build
  script:
    - cd wrappers/nodejs
    - npm i
    - npm run build
  only:
    - merge_requests
    - main
wasm-wrapper-build-job:
  image: cimg/node:${NODE_VERSION}-browsers
  before_script:
    - curl https://sh.rustup.rs -sSf | sh -s -- -y --default-toolchain ${RUST_VERSION}
    - source "$HOME/.cargo/env"
    - *cargo_local_deps_script
    - sudo apt-get update
    - sudo apt-get install -y clang
    - curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
  stage: build
  script:
    - cd wrappers/wasm
    - npm i
    - npm run build
  only:
    - merge_requests
    - main

nodejs-demo-build-job:
  <<: *nodejs_job_configs
  stage: build
  script:
    - cd demos/nodejs/oid4vc
    - npm i
    - npm run build
  only:
    - merge_requests
    - main

wasm-demo-build-job:
  image: cimg/node:${NODE_VERSION}-browsers
  before_script:
    - curl https://sh.rustup.rs -sSf | sh -s -- -y --default-toolchain ${RUST_VERSION}
    - source "$HOME/.cargo/env"
    - *cargo_local_deps_script
    - sudo apt-get update
    - sudo apt-get install -y clang
    - curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
  stage: build
  script:
    - cd demos/wasm/oid4vc
    - npm i
    - npm run build
  only:
    - merge_requests
    - main

doc-build-job:
  <<: *rust_job_configs
  stage: build
  script:
    - RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --workspace --all-features --exclude nodejs --exclude wasm --exclude asdk_uniffi
  only:
    - merge_requests
    - main

# Lint stage

check-format-job:
  <<: *rust_job_configs
  stage: lint
  script:
    - rustup component add rustfmt
    - cargo fmt --all -- --check
  only:
    - merge_requests
    - main

lint-job:
  <<: *rust_job_configs
  stage: lint
  script:
    - rustup component add clippy
    - cargo clippy --workspace --exclude wasm --all-targets --all-features -- -Dwarnings
  only:
    - merge_requests
    - main

# Test stage

test-with-coverage-job:
  <<: *rust_job_configs
  stage: test
  script:
    - cargo install cargo-tarpaulin
    - cargo tarpaulin --skip-clean --timeout 180 --all-features --exclude-files "src/didcomm/*" --exclude-files "demos/*" --exclude-files "dependencies/one-core/*" --exclude-files "wrappers/*" --fail-under 70 -o Html
  coverage: '/^\d+.\d+% coverage/'
  artifacts:
    paths:
      - tarpaulin-report.html
  only:
    - merge_requests
    - main

nodejs-test-job:
  <<: *nodejs_job_configs
  stage: test
  script:
    - cd wrappers/nodejs
    - npm i
    - npm run build:debug
    - npm run test
    - cd ../test/js_common
    - npm pkg set dependencies.agent-sdk=file:../../nodejs
    - npm i
    - npm run test:nodejs
  only:
    - merge_requests
    - main

askar-plugin-nodejs-test-job:
  <<: *nodejs_job_configs
  stage: test
  script:
    - npm i --prefix wrappers/nodejs
    - npm run build:debug --prefix wrappers/nodejs
    - npm i --prefix plugins/askar/wrappers/nodejs
    - npm run build --prefix plugins/askar/wrappers/nodejs
    - npm run test --prefix plugins/askar/wrappers/nodejs
  only:
    - merge_requests
    - main

wasm-test-job:
  image: cimg/node:${NODE_VERSION}-browsers
  before_script:
    - curl https://sh.rustup.rs -sSf | sh -s -- -y --default-toolchain ${RUST_VERSION}
    - source "$HOME/.cargo/env"
    - *cargo_local_deps_script
    - sudo apt-get update
    - sudo apt-get install -y clang
    - curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
  stage: test
  script:
    - cd wrappers/wasm
    - npm install
    - npm run build:dev:cjs
    #    Enable when tests are added
    #    - npm run test
    - cd ../test/js_common
    - npm pkg set dependencies.agent-sdk=file:../../wasm/pkg
    - npm i
    - npm run test:wasm
  only:
    - merge_requests
    - main

kotlin-test-job:
  <<: *rust_job_configs
  stage: test
  script:
    - apt-get update
    - apt-get install -y openjdk-17-jdk
    - cd wrappers/uniffi
    - make kotlin-test
  only:
    - merge_requests
    - main

#swift-test-job:
#  <<: *swift_job_configs
#  stage: test
#  script:
#    - rustup target add aarch64-apple-ios x86_64-apple-ios aarch64-apple-ios-sim
#    - cd wrappers/uniffi
#    - make ios-test
#  tags:
#    - macos
#  only:
#    - merge_requests
#    - main

# Demo stage

oid4vc-demo-job:
  <<: *rust_job_configs
  stage: demo
  script:
    - cd ./demos/oid4vc
    - ./demo.sh
  only:
    - merge_requests
    - main

# Release stage

release_artifacts_job:
  <<: *rust_job_configs
  stage: release
  script:
    - cargo install cargo-sbom
    - cargo install cargo-audit
    - cargo sbom &>  SBOM.auto.out
    - cargo audit &> AUDIT.auto.out || true
    - cargo doc --no-deps
    - tar -cvz -f API.auto.tar.gz target/doc/agent_sdk/
  artifacts:
    paths:
      - SBOM.auto.out
      - AUDIT.auto.out
      - API.auto.tar.gz
  rules:
    - if: $CI_COMMIT_TAG && $CI_COMMIT_TAG =~ $VERSION_REGEX
      when: always
    - when: never