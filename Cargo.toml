[workspace]
members = [
    "demos/oid4vc/issuer",
    "demos/oid4vc/verifier",
    "demos/oid4vc/holder",
    "demos/multi-thread",
    "plugins/askar",
    "plugins/askar/wrappers/nodejs",
    "wrappers/nodejs",
    "wrappers/wasm",
    "wrappers/uniffi",
    "common-macros",
]

[package]
name = "agent-sdk"
version = "1.1.0"
edition = "2024"
rust-version = "1.89.0"

[dependencies]
common-macros = { path = "./common-macros" }

oid4vci = { git = "ssh://git@git.slock.it/open-source/oid4vci-rs.git", rev = "56e2b976" }
openid4vp = { git = "ssh://git@git.slock.it/open-source/oid4vp-rs.git", rev = "0a15be65" }
sd-jwt-rs = { git = "ssh://git@git.slock.it/open-source/sd-jwt-rust.git", rev = "3725931d" }
didcomm = { git = "ssh://git@git.slock.it/open-source/didcomm-rust.git", rev = "db41780d" }

did_peer = { git = "ssh://git@git.slock.it/open-source/aries-vcx.git", rev = "fc818ef5" }
did_resolver = { git = "ssh://git@git.slock.it/open-source/aries-vcx.git", rev = "fc818ef5" }
did_parser_nom = { git = "ssh://git@git.slock.it/open-source/aries-vcx.git", rev = "fc818ef5" }

one-crypto = { git = "https://github.com/procivis/one-core", package = "one-crypto", rev = "edee569" }
one-core = { path = "dependencies/one-core" }
secrecy = "0.10.3"
ed25519-compact = "2.1.1"

oauth2 = "5.0.0-rc.1"
serde_json = "1.0.120"
ssi = { version = "=0.10.1", features = ["bbs"] }
time = { version = "=0.3.37", features = ["serde", "wasm-bindgen"] }
serde = { version = "=1.0.219", features = ["derive"] }
serde_urlencoded = "0.7.1"
serde_json_path = "0.7.1"
iref = "3.2.2"
futures = "0.3.30"
base64 = "0.22.1"
jsonwebtoken = "9.3.0"
async-trait = "0.1.85"
strum_macros = "0.26.4"
strum = { version = "0.26.3", features = ["derive"] }
reqwest = { version = "=0.12.12", features = ["rustls-tls"] }

uuid = { version = "1.10.0", features = ["v4"] }
url = "=2.5.4"
anyhow = "1.0.86"
tracing = { version = "0.1.40", features = ["attributes", "release_max_level_debug"] }
snafu = "0.8.4"
regex = "1.11.0"
mime = "0.3.17"
chrono = "0.4.38"
openidconnect = "4.0.0-rc.1"
zeroize = "1.8.1"
zkryptium = "0.2.2"
ssi-status = "0.3.0"
flate2 = "1.0.35"
async-lock = "3.4.0"
async-channel = "2.3.1"
lazy_static = "1.5.0"
jsonpath-rust = "0.7.5"
bs58 = "0.5.1"
p256 = "0.13.2"


# InMEM dependencies
# crypto/kms dependencies
ed25519-dalek = { version = "2.1.1", optional = true }
bip32 = "0.5.2"
askar-crypto = { version = "=0.3.3", optional = true }
# service
rand = { version = "0.9.2", optional = true }
ecdsa = { version = "0.16.9", optional = true }
hyper = { version = "0.14.32", features = ["full"], optional = true }
http = { version = "0.2", optional = true }
tokio = { version = "1.25.0", features = ["macros"], optional = true }
libc = "0.2.172"

# Transitive dependecies versioning
generic-array = "=0.14.7"# Pinned to solve deprecation warnings from transitive deps trying to update to 0.14.9

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
didcomm = { git = "ssh://git@git.slock.it/open-source/didcomm-rust.git", rev = "db41780d", features = ["uniffi"] }
reqwest-middleware = { version = "0.4.0", default-features = false }
reqwest-tracing = { version = "0.5.5", default-features = false }

[dev-dependencies]
mockall = "0.13.0"
# todo remove
mockito = "1.5.0"
httpmock = "0.8.0-alpha.1"
rstest = "0.22.0"
# InMEM dependencies
ed25519-dalek = "2.1.1"
bip32 = "0.5.2"
ecdsa = "0.16.9"

[features]
in-memory = ["dep:rand", "dep:ed25519-dalek", "dep:ecdsa", "dep:askar-crypto"]
didcomm-http-transport = ["dep:http", "dep:hyper", "dep:tokio"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
# Set to true when WASM allows using profiles or throws no error for strip=true (wasm-pack >0.13.1) https://github.com/rustwasm/wasm-pack/pull/1428/files
strip = "debuginfo"
incremental = true

[profile.release-strip]
inherits = "release"
strip = true

[profile.release-android]
inherits = "release"
strip = "none"
