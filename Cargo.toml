[workspace]
members = [
    "demos/oid4vc/issuer",
    "demos/oid4vc/verifier",
    "demos/oid4vc/holder",
    "demos/multi-thread",
    "plugins/askar",
    "plugins/askar/wrappers/nodejs",
    "wrappers/nodejs",
    "wrappers/wasm",
    "wrappers/uniffi",
    "common-macros",
]

[package]
name = "agent-sdk"
version = "0.8.4"
edition = "2021"
rust-version = "1.82"

[dependencies]
common-macros = { path = "./common-macros" }

oid4vci = { git = "ssh://git@git.slock.it/open-source/oid4vci-rs.git", rev = "94fac9cc" }
openid4vp = { git = "ssh://git@git.slock.it/open-source/oid4vp-rs.git", rev = "3a07c986" }
sd-jwt-rs = { git = "ssh://git@git.slock.it/open-source/sd-jwt-rust.git", rev = "3725931d" }
didcomm = { git = "ssh://git@git.slock.it/open-source/didcomm-rust.git", rev = "db41780d" }

did_peer = { git = "ssh://git@git.slock.it/open-source/aries-vcx.git", rev = "fc818ef5" }
did_resolver = { git = "ssh://git@git.slock.it/open-source/aries-vcx.git", rev = "fc818ef5" }
did_parser_nom = { git = "ssh://git@git.slock.it/open-source/aries-vcx.git", rev = "fc818ef5" }

oauth2 = "5.0.0-rc.1"
serde_json = "1.0.120"
ssi = { version = "0.10.1", features = ["bbs"] }
time = { version = "=0.3.37", features = ["serde", "wasm-bindgen"] }
serde = { version = "1.0.204", features = ["derive"] }
serde_urlencoded = "0.7.1"
serde_json_path = "0.7.1"
iref = "3.2.2"
futures = "0.3.30"
base64 = "0.22.1"
jsonwebtoken = "9.3.0"
async-trait = "0.1.85"
strum_macros = "0.26.4"
strum = { version = "0.26.3", features = ["derive"] }
reqwest = { version = "=0.12.12", features = ["rustls-tls"] }

uuid = { version = "1.10.0", features = ["v4"] }
url = "=2.5.2"
anyhow = "1.0.86"
tracing = { version = "0.1.40", features = ["attributes", "release_max_level_debug"] }
snafu = "0.8.4"
regex = "1.11.0"
mime = "0.3.17"
chrono = "0.4.38"
openidconnect = "4.0.0-rc.1"
zeroize = "1.8.1"
zkryptium = "0.2.2"
ssi-status = "0.3.0"
flate2 = "1.0.35"
base64ct = "=1.6.0"
libm = "=0.2.11"
async-lock = "3.4.0"
async-channel = "2.3.1"
getrandom = { version = "0.3.3", features = ["wasm_js"] }


# InMEM dependencies
# crypto/kms dependencies
p256 = { version = "0.13.2", optional = true }
ed25519-dalek = { version = "2.1.1", optional = true }
bip32 = { version = "0.5.2", optional = true }
askar-crypto = { version = "=0.3.3", optional = true }
bs58 = "0.5.1"
# service
rand = { version = "0.8.5", optional = true }
random-string = { version = "1.1.0", optional = true }
ecdsa = { version = "0.16.9", optional = true }
jsonpath-rust = "0.7.5"
hyper = { version = "0.14.32", features = ["full"], optional = true }
http = { version = "0.2", optional = true }
tokio = { version = "1.25.0", features = ["macros"], optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
didcomm = { git = "ssh://git@git.slock.it/open-source/didcomm-rust.git", rev = "db41780d", features = ["uniffi"] }
reqwest-middleware = { version = "0.4.0", default-features = false }
reqwest-tracing = { version = "0.5.5", default-features = false }

[dev-dependencies]
mockall = "0.13.0"
mockito = "1.5.0"
rstest = "0.22.0"
# InMEM dependencies
rand = "0.8.5"
ed25519-dalek = "2.1.1"
p256 = "0.13.2"
bip32 = "0.5.2"
random-string = "1.1.0"
ecdsa = "0.16.9"
tokio = { version = "1.25.0", features = ["macros"] }

[features]
in-memory = ["dep:rand", "dep:ed25519-dalek", "dep:p256", "dep:bip32", "dep:random-string", "dep:ecdsa", "dep:askar-crypto"]
didcomm-http-trasnport = ["dep:http", "dep:hyper", "dep:tokio"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
# Set to true when WASM allows using profiles or throws no error for strip=true
strip = "debuginfo"

[profile.release-strip]
inherits = "release"
strip = true
