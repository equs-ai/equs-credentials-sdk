[workspace]
members = [
    "demos/oid4vc/issuer",
    "demos/oid4vc/verifier",
    "demos/oid4vc/holder",
    "demos/multi-thread",
    "plugins/askar",
    "wrappers/nodejs",
    "common-macros",
]

[package]
name = "agent-sdk"
version = "0.5.1"
edition = "2021"
rust-version = "1.82"

[dependencies]
common-macros = { path = "./common-macros" }

oid4vci = { git = "ssh://git@git.slock.it/open-source/oid4vci-rs.git", rev = "ef7b3925" }
openid4vp = { git = "ssh://git@git.slock.it/open-source/oid4vp-rs.git", rev = "fd87fbb8" }
sd-jwt-rs = { git = "ssh://git@git.slock.it/open-source/sd-jwt-rust.git", rev = "cc541b0d" }
didcomm = { git = "ssh://git@git.slock.it/open-source/didcomm-rust.git", rev = "db41780d" }

did_peer = { tag = "0.65.0", git = "https://github.com/hyperledger/aries-vcx" }
did_resolver = { tag = "0.65.0", git = "https://github.com/hyperledger/aries-vcx" }
did_parser_nom = { tag = "0.65.0", git = "https://github.com/hyperledger/aries-vcx" }

oauth2 = "5.0.0-rc.1"
serde_json = "1.0.120"
ssi = { version = "0.10.1", features = ["bbs"] }
time = { version = "0.3.29", features = ["serde"] }
serde = { version = "1.0.204", features = ["derive"] }
serde_urlencoded = "0.7.1"
serde_json_path = "0.7.1"
iref = "3.2.2"
futures = "0.3.30"
base64 = "0.22.1"
jsonwebtoken = "9.3.0"
async-trait = "0.1.85"
strum_macros = "0.26.4"
strum = { version = "0.26.3", features = ["derive"] }
reqwest = { version = "0.12.9", features = ["rustls-tls"] }

uuid = { version = "1.10.0", features = ["v4"] }
url = "=2.5.2"
anyhow = "1.0.86"
tracing = { version = "0.1.40", features = ["attributes", "release_max_level_info"] }
snafu = "0.8.4"
regex = "1.11.0"
mime = "0.3.17"
chrono = "0.4.38"
openidconnect = "4.0.0-rc.1"
zeroize = "1.8.1"
zkryptium = "0.2.2"
json-syntax = "0.12.5"
ssi-claims-core = "0.1.2"
ssi-dids = "0.2.1"
ssi-status = "0.3.0"
flate2 = "1.0.35"

# InMEM dependencies
# crypto/kms dependencies
p256 = { version = "0.13.2", optional = true }
ed25519-dalek = { version = "2.1.1", optional = true }
bip32 = { version = "0.5.2", optional = true }
askar-crypto = { version = "0.3.3", optional = true }
bs58 = "0.5.1"
# service
rand = { version = "0.8.5", optional = true }
random-string = { version = "1.1.0", optional = true }
async-rwlock = { version = "1.3.0", optional = true }
ecdsa = { version = "0.16.9", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest-middleware = { version = "0.4.0", default-features = false }
reqwest-tracing = { version = "0.5.5", default-features = false }

[dev-dependencies]
tokio = { version = "1.25.0", features = ["macros"] }
mockall = "0.13.0"
mockito = "1.5.0"
rstest = "0.22.0"
async-mutex = "1.4.0"
# InMEM dependencies
rand = "0.8.5"
ed25519-dalek = "2.1.1"
p256 = "0.13.2"
bip32 = "0.5.2"
random-string = "1.1.0"
async-rwlock = "1.3.0"
ecdsa = "0.16.9"

[features]
in-memory = ["dep:rand", "dep:ed25519-dalek", "dep:p256", "dep:bip32", "dep:async-rwlock", "dep:random-string", "dep:ecdsa", "dep:askar-crypto"]
