[workspace]
members = ["demos/oid4vc", "demos/oid4vc/holder", "demos/multi-thread"]

[package]
name = "agent-sdk"
version = "0.2.2"
edition = "2021"
rust-version = "1.79"

[dependencies]
oid4vci = { git = "ssh://git@git.slock.it/open-source/oid4vci-rs.git", rev = "706b443a" }
oid4vp = { git = "ssh://git@git.slock.it/open-source/oid4vp-rs.git", rev = "134802ae" }
sd-jwt-rs = { git = "ssh://git@git.slock.it/open-source/sd-jwt-rust.git", rev = "f49801f6" }

oauth2 = "4.4.2"
serde_json = "1.0.120"
ssi = "0.7.0"
rand = { version = "0.8.5", optional = true }
ed25519-dalek = { version = "2.1.1", optional = true }
random-string = "1.1.0"
time = { version = "0.3.29", features = ["serde"] }
serde = { version = "1.0.204", features = ["derive"] }
p256 = { version = "0.13.2", optional = true }
did-method-key = "0.2.2"
futures = "0.3.30"
base64 = "0.22.1"
jsonwebtoken = "9.3.0"
async-trait = "0.1.81"
strum_macros = "0.26.4"
strum = { version = "0.26.3", features = ["derive"] }
reqwest = "0.11"
uuid = { version = "1.10.0", features = ["v4"] }
url = "2.5.2"
anyhow = "1.0.86"
aries-askar = { version = "0.3.1", optional = true }
async-rwlock = "1.3.0"
tracing = { version = "0.1.40", features = ["attributes", "release_max_level_warn"] }
snafu = "0.8.4"


[dev-dependencies]
serde_urlencoded = "0.7.1"
tokio = { version = "1.25.0", features = ["macros"] }
mockall = "0.13.0"
rstest = "0.22.0"
async-mutex = "1.4.0"
rand = { version = "0.8.5"}
ed25519-dalek = { version = "2.1.1"}
p256 = { version = "0.13.2"}

[features]
askar = ["dep:aries-askar"]
in-memory = ["dep:rand", "dep:ed25519-dalek", "dep:p256"]
