[package]
name = "demo"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4.8.0"
actix-web-httpauth = "0.8.2"
jsonwebtoken = "9.3.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["blocking"] }
keycloak = "25.0.0"
p256 = { version = "0.13.2", features = ["jwk"] }
hex-literal = "0.4.1"
uuid = { version = "1.10.0", features = ["v4"] }
ssi = "0.7.0"
anyhow = "1.0.75"
async-trait = "0.1.73"
tracing-subscriber = "0.3.18"

agent-sdk = { path = "../.." }
