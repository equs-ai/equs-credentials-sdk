[package]
name = "agent"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[dependencies]
equs-sdk = { path = "../../..", features = ["in-memory", "delegate-sd-jwt"] }
shared = { path = "../shared" }

actix-web = "4.8.0"
serde_json = "1.0"
snafu = "0.9.1"
reqwest = { version = "0.12", features = ["blocking"] }
serde_urlencoded = "0.7.1"
tracing-subscriber = "0.3.18"
uuid = { version = "1.10.0", features = ["v4"] }
