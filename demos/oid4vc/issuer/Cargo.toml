[package]
name = "issuer"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
license = "Apache-2.0"

[features]
# ci_demo feature disables some KeyCloak interactions to make CI demo workflows pass
ci_demo = []

[dependencies]
actix-web = "4.8.0"
actix-web-httpauth = "0.8.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["blocking"] }
keycloak = "25.0.0"
tracing-subscriber = "0.3.18"

equs-sdk = { path = "../../..", features = ["in-memory"] }
