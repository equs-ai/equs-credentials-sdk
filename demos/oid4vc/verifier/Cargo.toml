[package]
name = "verifier"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4.8.0"
actix-web-httpauth = "0.8.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["blocking"] }
tracing-subscriber = "0.3.18"

agent-sdk = { path = "../../..", features = ["in-memory"]}
