<text x="54" y="74" fill="#ffffff" font-size="30" font-weight="700">Equs SDK</text>
<text x="56" y="100" fill="#ffffff" fill-opacity="0.85" font-size="13">Rust building blocks to issue, hold, present and verify credentials — for people, organisations, and the agents acting</text>
<text x="56" y="118" fill="#ffffff" fill-opacity="0.85" font-size="13">on their behalf.</text>
