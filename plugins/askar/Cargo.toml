[package]
name = "askar"
version = "0.1.0"
edition = "2021"

[dependencies]
serde_json = "1.0.120"
agent-sdk = { path = "../../" }
aries-askar = "0.4.0"
async-trait = "0.1.81"
snafu = "0.8.4"
uuid = { version = "1.10.0", features = ["v4"] }
random-string = "1.1.0"
tracing = { version = "0.1.40", features = ["attributes", "release_max_level_warn"] }

[dev-dependencies]
tokio = { version = "1.25.0", features = ["macros"] }