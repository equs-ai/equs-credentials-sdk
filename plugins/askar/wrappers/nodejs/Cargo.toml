[package]
name = "askar-nodejs"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2.16.11", default-features = false, features = ["napi4", "async", "serde-json"] }
napi-derive = "2.16.12"
askar = {path = "../.."}
serde = { version = "1.0.204", features = ["derive"] }
serde_json = "1.0.120"
async-trait = "0.1.81"

[build-dependencies]
napi-build = "2.1.3"

[profile.release]
lto = true
strip = "symbols"