variables:
  REGISTRY_URL_NPM: https://${CI_SERVER_HOST}/api/v4/projects/${CI_PROJECT_ID}/packages/npm/

.cargo_local_deps_script: &cargo_local_deps_script
  - |
    git config --global --get-regexp '^url\..*\.insteadof$' 2>/dev/null | while read -r key value; do
      case "$value" in
        *git.slock.it*) git config --global --remove-section "${key%.insteadof}" 2>/dev/null || true ;;
      esac
    done || true
  - git config --global url."https://gitlab-ci-token:${CI_JOB_TOKEN}@git.slock.it/".insteadOf "ssh://git@git.slock.it/"

.nodejs_askar_storage_job_configs: &nodejs_askar_storage_job_configs
  image: node:${NODE_VERSION}
  before_script:
    - curl https://sh.rustup.rs -sSf | sh -s -- -y --default-toolchain ${RUST_VERSION}
    - source "$HOME/.cargo/env"
    - export RUSTC_WRAPPER=""
    - *cargo_local_deps_script

.nodejs_askar_storage_to_registry_template: &nodejs_askar_storage_to_registry_template
  <<: *nodejs_askar_storage_job_configs
  stage: release
  rules:
    - if: $CI_COMMIT_TAG && $CI_COMMIT_TAG =~ $VERSION_REGEX
    - when: never

publish_askar_nodejs_target:
  <<: *nodejs_askar_storage_to_registry_template
  rules:
    - if: $CI_COMMIT_TAG && $CI_COMMIT_TAG =~ $RELEASE_VERSION_REGEX
    - when: never
  script:
    - |
      cd plugins/askar/wrappers/nodejs
      chmod +x scripts/build_and_publish_target.sh
      NPM_TOKEN=${CI_JOB_TOKEN} TARGET=${TARGET} ALIAS=${ALIAS} ENVIRONMENT=production scripts/build_and_publish_target.sh
  parallel:
    matrix:
      - TAGS: "linux"
        ALIAS: "linux-x64-gnu"
        TARGET: "x86_64-unknown-linux-gnu"
      - TAGS: "macos"
        ALIAS: "darwin-arm64"
        TARGET: "aarch64-apple-darwin"
      - TAGS: "macos"
        ALIAS: "darwin-x64"
        TARGET: "x86_64-apple-darwin"
  tags:
    - $TAGS
  variables:
    ALIAS: $ALIAS
    TARGET: $TARGET

publish_askar_nodejs_wrapper:
  <<: *nodejs_askar_storage_to_registry_template
  rules:
    - if: $CI_COMMIT_TAG && $CI_COMMIT_TAG =~ $RELEASE_VERSION_REGEX
    - when: never
  script:
    - |
      npm i --prefix wrappers/nodejs
      npm run --prefix wrappers/nodejs build
      cd plugins/askar/wrappers/nodejs
      chmod +x scripts/build_and_publish_wrapper.sh
      NPM_TOKEN=${CI_JOB_TOKEN} ENVIRONMENT=production scripts/build_and_publish_wrapper.sh
