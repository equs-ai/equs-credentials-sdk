[package]
name = "equs-test-fixtures"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.0"
license = "Apache-2.0"
description = "JWT and JWE test fixtures for the EQUS Credentials SDK"
publish = false

[lib]
name = "test_fixtures"

[dependencies]
equs-credentials-sdk = { path = "..", features = ["in-memory"] }
base64 = "0.22.1"
serde_json = "1.0.120"
async-trait = "0.1.85"
snafu = "0.8.4"
rcgen = { version = "0.14", optional = true }

[dev-dependencies]
tokio = { version = "1.25.0", features = ["macros", "rt"] }

[features]
default = ["x509"]
x509 = ["dep:rcgen"]

[[test]]
name = "x509"
required-features = ["x509"]
