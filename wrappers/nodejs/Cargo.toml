[package]
edition = "2021"
name = "nodejs"
version = "0.0.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
# Default enable napi4 feature, see https://nodejs.org/api/n-api.html#node-api-version-matrix
napi = { version = "2.16.11", default-features = false, features = ["napi4", "async", "serde-json"] }
napi-derive = "2.16.12"
agent-sdk = { path = "../.." }
serde = { version = "1.0.204", features = ["derive"] }
serde_json = "1.0.120"
url = "2.5.2"
async-trait = "0.1.81"
oauth2 = "4.4.2"
time = { version = "0.3.29", features = ["serde"] }
tokio = "1.40.0"

[build-dependencies]
napi-build = "2.1.3"

[profile.release]
lto = true
strip = "symbols"


[features]
in-memory = ["agent-sdk/in-memory"]