[package]
edition = "2024"
name = "nodejs"
version = "0.0.0"
rust-version = "1.89.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
# Default enable napi4 feature, see https://nodejs.org/api/n-api.html#node-api-version-matrix
napi = { version = "2.16.11", default-features = false, features = ["napi5", "async", "serde-json", "chrono_date"] }
napi-derive = "2.16.12"
agent-sdk = { path = "../.." }
serde = { version = "1.0.204", features = ["derive"] }
serde_json = "1.0.120"
url = "2.5.2"
async-trait = "0.1.81"
time = { version = "0.3.29", features = ["serde"] }
tokio = "1.40.0"
tracing-subscriber = { version = "0.3.18", features = ["fmt", "json", "env-filter"] }
tracing = { version = "0.1.40" }
chrono = "0.4.38"
log = "0.4.22"
either = "1.14.0"
strum_macros = "0.27.2"

[build-dependencies]
napi-build = "2.1.3"

[features]
in-memory = ["agent-sdk/in-memory"]
