[package]
name = "asdk_uniffi"
version = "0.1.0"
edition = "2021"

[dependencies]
agent-sdk = { path = "../..", features = ["in-memory"] }
uniffi = { version = "0.29.0", features = ["cli", "tokio"] }
serde_json = "1.0.140"
serde = { version = "1.0.219", features = ["derive"] }
time = { version = "0.3.29", features = ["serde"] }

[build-dependencies]
uniffi = { version = "0.29.0", features = ["build"] }

[lib]
crate-type = ["cdylib"]
name = "asdk"

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"