[package]
name = "equs_sdk_uniffi"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.0"
license = "Apache-2.0"
publish = false

[dependencies]
equs-credentials-sdk = { path = "../..", features = ["in-memory"] }
uniffi = { version = "0.29.0", features = ["cli", "tokio"] }
serde_json = "1.0.140"
serde = { version = "1.0.219", features = ["derive"] }
async-trait = "0.1.88"
tracing = "0.1.40"
url = "2.5.2"
time = { version = "0.3.29", features = ["serde"] }
oauth2 = "5.0.0-rc.1"

[build-dependencies]
uniffi = { version = "0.29.0", features = ["build"] }

[lib]
crate-type = ["cdylib", "staticlib", "lib"]
name = "equssdk"

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"

[[bin]]
name = "uniffi-bindgen-swift"
path = "uniffi-bindgen-swift.rs"
