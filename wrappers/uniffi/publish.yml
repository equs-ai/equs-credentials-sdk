variables:
  REGISTRY_URL_IOS: https://${CI_SERVER_HOST}/api/v4/projects/${CI_PROJECT_ID}/packages/generic/
  REGISTRY_URL_MAVEN: https://${CI_SERVER_HOST}/api/v4/projects/${CI_PROJECT_ID}/packages/maven/
  ANDROID_HOME: ${CI_PROJECT_DIR}/Android
  NDK_VERSION: 29.0.13599879

.ios_job_configs: &ios_job_configs
  tags:
    - macos
  image: rust:${RUST_VERSION}
  before_script:
    - brew update
    - brew install curl unzip zip git jq openssl pkg-config swift swiftlint
    - curl https://sh.rustup.rs -sSf | sh -s -- -y --default-toolchain ${RUST_VERSION}
    - source "$HOME/.cargo/env"
    - rustup target add aarch64-apple-ios x86_64-apple-ios aarch64-apple-ios-sim
    - swift --version
    - cargo --version
    - export RUSTC_WRAPPER=""

.ios_to_registry_template: &ios_to_registry_template
  <<: *ios_job_configs
  stage: release
  timeout: 1h
  # The prod and dev jobs share one macOS runner and both call `brew update`,
  # which takes a global lock. Serialize them so the second does not abort with
  # "Another `brew update` process is already running."
  resource_group: ios_publish
  rules:
    - when: never

publish_ios_wrapper:
  <<: *ios_to_registry_template
  rules:
    - if: $CI_COMMIT_TAG && $CI_COMMIT_TAG =~ $RELEASE_VERSION_REGEX
    - when: never
  script:
    - cd wrappers/uniffi
    - chmod +x ./scripts/build_and_publish_ios.sh
    - ./scripts/build_and_publish_ios.sh

publish_ios_wrapper_dev:
  <<: *ios_to_registry_template
  rules:
    - if: $CI_COMMIT_TAG && $CI_COMMIT_TAG =~ $PRERELEASE_VERSION_REGEX
    - when: never
  script:
    - cd wrappers/uniffi
    - chmod +x ./scripts/build_and_publish_ios.sh
    - ENVIRONMENT=development ./scripts/build_and_publish_ios.sh


.android_job_configs: &android_job_configs
  image: eclipse-temurin:17-jdk-jammy
  before_script:
    - |
      if [ -z "${REGISTRY_URL_MAVEN:-}" ]; then
        echo "No REGISTRY_URL_MAVEN"
        exit 1
      fi
    - apt-get -o Acquire::Retries=3 update && apt-get -o Acquire::Retries=3 install -y curl unzip wget git build-essential pkg-config libssl-dev
    - curl https://sh.rustup.rs -sSf | sh -s -- -y --default-toolchain ${RUST_VERSION}
    - source "$HOME/.cargo/env"
    - export RUSTC_WRAPPER=""
    - |
      mkdir -p "$ANDROID_HOME/cmdline-tools"
      wget -q https://dl.google.com/android/repository/commandlinetools-linux-10406996_latest.zip -O tools.zip
      unzip -q tools.zip -d "$ANDROID_HOME/cmdline-tools/temp"
      mv "$ANDROID_HOME/cmdline-tools/temp/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
      rm -rf tools.zip "$ANDROID_HOME/cmdline-tools/temp"

      export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION"
      export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
      yes | sdkmanager --licenses || true

      # Build/publish only — no emulator or system image is needed here, and
      # they add several GB to the pod's ephemeral storage footprint.
      sdkmanager --sdk_root=$ANDROID_HOME \
        "platform-tools" "platforms;android-33" "build-tools;34.0.0" \
        "ndk;$NDK_VERSION"

    - export PATH="$ANDROID_HOME/ndk/$NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"

.android_to_registry_template: &android_to_registry_template
  <<: *android_job_configs
  stage: release
  # Each job pulls the Android SDK/NDK and runs a full Rust build. Running the
  # prod and dev jobs concurrently exhausted the node's ephemeral storage and
  # got the pod evicted (TerminationByKubelet), so serialize them.
  resource_group: android_publish
  rules:
    - when: never

publish_android_wrapper:
  <<: *android_to_registry_template
  rules:
    - if: $CI_COMMIT_TAG && $CI_COMMIT_TAG =~ $RELEASE_VERSION_REGEX
    - when: never
  script:
    - |
      cd wrappers/uniffi
      make android-aar
      cd kotlin
      ./gradlew publish

publish_android_wrapper_dev:
  <<: *android_to_registry_template
  rules:
    - if: $CI_COMMIT_TAG && $CI_COMMIT_TAG =~ $PRERELEASE_VERSION_REGEX
    - when: never
  script:
    - |
      cd wrappers/uniffi
      make android-aar-dev
      cd kotlin
      ./gradlew publish -Penv=development
