[package]
name = "wasm"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.0"
license = "Apache-2.0"
repository = "https://github.com/equs-ai/equs-credentials-sdk"
homepage = "https://github.com/equs-ai/equs-credentials-sdk/tree/main/wrappers/wasm#readme"
publish = false

[features]
default = ['console_error_panic_hook']
test-utils = ["dep:equs-test-fixtures"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
equs-credentials-sdk = { path = "../..", features = ["in-memory"] }
equs-test-fixtures = { path = "../../test-fixtures", optional = true, default-features = false }

async-trait = '0.1.85'
wasm-bindgen-futures = '=0.4.50'
js-sys = '0.3'
serde_json = '1.0'
serde = { version = "1.0.217", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
oauth2 = "5.0.0-rc.1"
web-sys = { version = "0.3", features = ["console"] }
url = { version = "2.5.2", features = ["serde"] }
getrandom = { version = "0.4", features = ["wasm_js"] }

[dependencies.wasm-bindgen]
version = '0.2.100'

[dependencies.console_error_panic_hook]
version = '0.1'
optional = true

[dependencies.wee_alloc]
version = '0.4'
optional = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = [
    "-Oz",
    "--enable-bulk-memory",
    "--enable-multivalue",
    "--enable-mutable-globals",
    "--enable-nontrapping-float-to-int",
    "--enable-reference-types",
    "--enable-sign-ext",
    "--enable-simd",
]
